      t += tile(tCol(tr), esc(tr.name), `${dn}<small>/${n} days</small>`, capFirst(gw), tIc(tr), cmp(dn/n, pdn/pn, `${pdn}/${pn} days`));
    } else {
      const sum = days.reduce((s,k) => s + tVal(k,tr.id), 0), psum = pdays.reduce((s,k) => s + tVal(k,tr.id), 0);
      const gw = tr.period==='day' ? `goal hit ${days.filter(k => tDayHit(tr,k)).length}/${n} days` : (r => wk ? `goal ${num(tr.goal,2)} a week` : `${r.hit}/${r.of} weeks hit`)(evalWeeks(weeks, ws => tWeekHit(tr,ws)));
      t += tile(tCol(tr), esc(tr.name), `${num(sum,2)}<small> ${esc(tr.unit||'')}</small>`, `${capFirst(gw)}&nbsp;· ${num(sum/n,1)}/day`, tIc(tr), cmp(sum/n, psum/(pn||1), `${num(psum,2)} ${esc(tr.unit||'')}`));
    }
  });
  const wkTxt = fn => { const r = evalWeeks(weeks, fn); return `${r.hit}/${r.of} weeks hit`; };
  const runCmp = cmp(sumKm(runs)/n, sumKm(pruns)/(pn||1), `${num(sumKm(pruns))} km`), gymCmp = cmp(gyms.length/n, pgyms.length/(pn||1), plural(pgyms.length,'session'));

    t += tile('var(--run)','Runs', `${runs.length}<small>/${g.runGoal}</small>${runs.length>=g.runGoal?OKM:''}`, `${num(sumKm(runs))} of ${num(g.kmGoal)} km`, 'run', runCmp);
    const sp = SPLITS.map(s => [s, gyms.filter(x => (x.split||'Other')===s).length]).filter(x => x[1]).map(x => `${x[1]} ${x[0].toLowerCase()}`).join(' · ');
    t += tile('var(--gym)','Gym', `${gyms.length}<small>/${g.gymGoal}</small>${gyms.length>=g.gymGoal&&g.gymGoal?OKM:''}`, sp ? capFirst(sp) : 'No sessions', 'gym', gymCmp);
    if (foots.length) t += tile('var(--foot)','Football', `${foots.length}<small> ${foots.length===1?'game':'games'}</small>`, `${sumMin(foots)} min`, 'ball');
  } else {
    t += tile('var(--run)','Runs', `${runs.length}<small> · ${num(sumKm(runs))} km</small>`, `${capFirst(wkTxt(runWeekHit))}&nbsp;· ${num(perWeek(sumKm(runs),n))} km/wk`, 'run', runCmp);
    t += tile('var(--gym)','Gym', `${gyms.length}<small> ${gyms.length===1?'session':'sessions'}</small>`, `${capFirst(wkTxt(gymWeekHit))}&nbsp;· ${num(perWeek(gyms.length,n))}/wk`, 'gym', gymCmp);
    if (foots.length) t += tile('var(--foot)','Football', `${foots.length}<small> ${foots.length===1?'game':'games'}</small>`, `${sumMin(foots)} min&nbsp;· ${wkTxt(footWeekHit)}`, 'ball');
  }
  h += summaryHero(a, b, days, pdays, pLabel);
  if (pn) h += `<div class="cmpnote"><span class="trend up">${I.arrUp}</span><span class="trend down">${I.arrDown}</span><span>Compared with the same days, ${esc(pLabel)}. Tap an arrow for the figure.</span></div>`;
  h += `<div class="tiles">${t}</div>`;

  const allDays = range(a,b), counted = new Set(days);
  const lab = allDays.map((k,i) => UI.per==='week' ? DOW1[i] : ((i===0 || (i+1)%5===0) ? String(i+1) : ''));
  const waterDays = () => card('Water|per day', 'Litres · dashed line = goal', barChart({
      labels: lab, values: allDays.map(k => counted.has(k) ? waterTotal(k)/1000 : null), color:'var(--water)',
      goal: g.waterGoal/1000, tips: allDays.map(k => counted.has(k) ? `${fmtDay(k,{weekday:'short',day:'numeric',month:'short'})}: ${L(waterTotal(k))} L` : 'No data')}), false, 'drop', 'var(--water)');
  const prayerDays = () => card('Prayers|by day', 'Tap a bar for detail', stackChart({
      labels: lab, stacks: allDays.map(k => counted.has(k) ? (c => [c.on,c.late,c.missed,c.none])(prayerCounts(k)) : null), max:5,
      tips: allDays.map(k => counted.has(k) ? (c => `${fmtDay(k,{weekday:'short',day:'numeric',month:'short'})}: ${c.on} on time, ${c.late} late, ${c.missed} missed${c.none?`, ${c.none} not logged`:''}`)(prayerCounts(k)) : 'No data')}) + prayerLegend(), false, 'moon', 'var(--prayer)');

  if (UI.per === 'week'){
    h += card('Habits|day by day', 'Filled = done', habitGrid(allDays, counted), false, 'grid', 'var(--habit)');
    h += prayerDays();
    h += waterDays();
    h += gymSplitCard(a,b);
  } else if (UI.per === 'month'){
    h += calendarCard(a,b,counted);
    h += prayerDays();
    h += waterDays();
    h += card('Runs|km by week', '', barChart({labels: weeks.map(ws => shortDate(ws)), values: weeks.map(ws => weekProgress(ws).km), color:'var(--run)', showVals:true, goal: g.kmGoal||null,
      tips: weeks.map(ws => { const p = weekProgress(ws); return `w/c ${shortDate(ws)}: ${p.runs} runs · ${num(p.km)} km`; })}), false, 'run', 'var(--run)');
    h += gymSplitCard(a,b);
  } else {
    const months = [...Array(12).keys()].map(m => { const y = a.slice(0,4); const ma = `${y}-${pad(m+1)}-01`, mb = keyOf(new Date(+y, m+1, 0)); return {m, a:ma, b:mb, days: days.filter(k => k>=ma && k<=mb)}; });
    const mlab = months.map(x => MONTHS[x.m].charAt(0));
    h += yearCard(a);
    h += card('Prayers|by month', 'Share of all prayers', stackChart({
      labels: mlab, max:100, stacks: months.map(x => { if (!x.days.length) return null; const c = sumP(x.days), T = x.days.length*5; return [c.on/T*100, c.late/T*100, c.missed/T*100, c.none/T*100]; }),
      tips: months.map(x => { if (!x.days.length) return `${MONTHS[x.m]}: no data`; const c = sumP(x.days), T = x.days.length*5; return `${MONTHS[x.m]}: ${pct(c.on,T)}% on time, ${pct(c.late,T)}% late, ${pct(c.missed,T)}% missed`; })}) + prayerLegend(), false, 'moon', 'var(--prayer)');
    h += card('Water|daily average', 'Litres a day, by month', barChart({
      labels: mlab, values: months.map(x => x.days.length ? x.days.reduce((s,k)=>s+waterTotal(k),0)/x.days.length/1000 : null),
      color:'var(--water)', goal:g.waterGoal/1000, tips: months.map(x => x.days.length ? `${MONTHS[x.m]}: avg ${L(x.days.reduce((s,k)=>s+waterTotal(k),0)/x.days.length)} L · goal met ${x.days.filter(waterHit).length}/${x.days.length} days` : `${MONTHS[x.m]}: no data`)}), false, 'drop', 'var(--water)');
    h += card('Runs|km by month', '', barChart({labels:mlab, values: months.map(x => x.days.length ? sumKm(actsIn(x.a,x.b,'run')) : null), color:'var(--run)', showVals:true,
      tips: months.map(x => { const r = actsIn(x.a,x.b,'run'); return `${MONTHS[x.m]}: ${r.length} runs · ${num(sumKm(r))} km`; })}), false, 'run', 'var(--run)');
    h += paceCard(a,b);
    h += gymSplitCard(a,b);
    h += card('Every month|in numbers', '', monthTable(months), true, 'table', 'var(--grey)');
  }
  return h;
}
const card = (title, sub, body, flush) => { const [ta, tb] = title.split('|'); return sec(ta, tb) + `<div class="card">${sub ? `<div class="cap">${sub}</div>` : ''}${flush ? `<div class="scrollx">${body}</div>` : body}</div>`; };
const prayerLegend = () => `<div class="legend"><span><i style="background:var(--good)"></i>On time</span><span><i style="background:var(--warn)"></i>Late</span><span><i style="background:var(--bad)"></i>Missed</span><span><i style="background:var(--none)"></i>Not logged</span></div>`;

/* ---------------- charts (hand-drawn SVG, no libraries) ---------------- */
function topRound(x,y,w,h,r){
  if (h <= 0) return '';
  r = Math.min(r, w/2, h);
  return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
}
function barChart({labels, values, color, goal, tips, showVals, height=130}){
  const W = 320, top = 14, bot = 18, H = height, ih = H-top-bot, n = values.length, slot = W/n;
  const bw = Math.max(3, Math.min(28, slot*0.62));
  const vmax = Math.max(goal ? goal*1.15 : 0, ...values.filter(v => v!=null), 0.0001);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  [0.5,1].forEach(f => s += `<line x1="0" x2="${W}" y1="${top+ih-ih*f}" y2="${top+ih-ih*f}" stroke="var(--line)" stroke-width=".6" opacity=".7"/>`);
  s += `<line x1="0" x2="${W}" y1="${top+ih}" y2="${top+ih}" stroke="var(--line)"/>`;
  values.forEach((v,i) => {
    const x = i*slot + (slot-bw)/2;
    if (v != null && v > 0){ const bh = v/vmax*ih; s += `<path d="${topRound(x, top+ih-bh, bw, bh, Math.min(6, bw/2))}" fill="${color}"/>`;
      if (showVals && n <= 12) s += `<text class="val" x="${x+bw/2}" y="${top+ih-bh-4}" text-anchor="middle">${num(v)}</text>`; }
    if (labels[i]) s += `<text class="ax" x="${i*slot+slot/2}" y="${H-4}" text-anchor="middle">${labels[i]}</text>`;
    if (tips) s += `<rect class="hit" x="${i*slot}" y="0" width="${slot}" height="${H}" fill="transparent" data-tip="${esc(tips[i])}"/>`;
  });
  if (goal){ const gy = top + ih - goal/vmax*ih; s += `<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="5 4" pointer-events="none"/>`; }
  return s + `</svg>`;
}
function stackChart({labels, stacks, max, tips, height=110}){
  const W = 320, top = 6, bot = 18, H = height, ih = H-top-bot, n = stacks.length, slot = W/n;
  const bw = Math.max(3, Math.min(28, slot*0.62)), cols = ['var(--good)','var(--warn)','var(--bad)','var(--none)'];
  const gap = n > 14 ? 1 : 2;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  stacks.forEach((st,i) => {
    const x = i*slot + (slot-bw)/2;
    if (st){ let y = top+ih; st.forEach((v,j) => { if (!v) return; const hh = v/max*ih; y -= hh; s += `<rect x="${x}" y="${y+gap/2}" width="${bw}" height="${Math.max(0,hh-gap)}" rx="${Math.min(3,bw/2)}" fill="${cols[j]}"/>`; }); }
    if (labels[i]) s += `<text class="ax" x="${i*slot+slot/2}" y="${H-4}" text-anchor="middle">${labels[i]}</text>`;
    if (tips) s += `<rect class="hit" x="${i*slot}" y="0" width="${slot}" height="${H}" fill="transparent" data-tip="${esc(tips[i])}"/>`;
  });
  return s + `</svg>`;
}
function prayerByName(days){
  const W = 320, rowH = 28, cols = ['var(--good)','var(--warn)','var(--bad)','var(--none)'], n = days.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${PRAYERS.length*rowH}" role="img">`;
  PRAYERS.forEach(([id,name],i) => {
    const c = {on:0,late:0,missed:0,none:0};
    days.forEach(k => { const v = (day(k).p||{})[id]; c[v==='on'?'on':v==='late'?'late':v==='missed'?'missed':'none']++; });
    const y = i*rowH + 4, x0 = 70, bw = 200; let x = x0;
    s += `<text class="lab" x="0" y="${y+11}">${name}</text>`;
    s += `<rect x="${x0}" y="${y}" width="${bw}" height="14" rx="7" fill="var(--track)"/>`;
    [c.on,c.late,c.missed,c.none].forEach((v,j) => { if (!v) return; const w = v/n*bw; s += `<rect x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="14" rx="5" fill="${cols[j]}"/>`; x += w; });
    s += `<text class="val num" x="${W}" y="${y+11}" text-anchor="end">${c.on}/${n}</text>`;
    s += `<rect class="hit" x="0" y="${y-4}" width="${W}" height="${rowH}" fill="transparent" data-tip="${name}: ${c.on} on time, ${c.late} late, ${c.missed} missed${c.none?`, ${c.none} not logged`:''}"/>`;
  });
  return s + `</svg>` + prayerLegend();
}
function habitGrid(allDays, counted){
  const rows = [
    ['Run','var(--run)', k => actsOn(k).some(a => a.type==='run')],
    ['Gym','var(--gym)', k => actsOn(k).some(a => a.type==='gym')],
    ...(allDays.some(k => actsOn(k).some(a => a.type==='football')) ? [['Football','var(--foot)', k => actsOn(k).some(a => a.type==='football')]] : []),
    ['Water','var(--water)', waterHit],
    ['Prayers','var(--prayer)', prayerHit],
    ...shownTrackers().map(t => [t.name, tCol(t), k => tDayHit(t,k)])
  ];
  const W = 320, rh = 26, x0 = Math.min(150, Math.max(84, Math.max(...rows.map(r => r[0].length)) * 7.4 + 12)), step = (W-x0-10)/6;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${rows.length*rh+18}" role="img">`;
  rows.forEach(([name,color,fn],i) => {
    const y = i*rh + 12;
    s += `<text class="lab" x="0" y="${y+4}">${esc(name)}</text>`;
    allDays.forEach((k,j) => {
      const cx = x0 + j*step + 5, ok = counted.has(k) && fn(k);
      s += ok ? `<circle cx="${cx}" cy="${y}" r="8" fill="${color}"/>` : `<circle cx="${cx}" cy="${y}" r="7" fill="none" stroke="var(--none)" stroke-width="1.6" ${counted.has(k)?'':'stroke-dasharray="2 2"'}/>`;
    });
  });
  allDays.forEach((k,j) => s += `<text class="ax" x="${x0 + j*step + 5}" y="${rows.length*rh+14}" text-anchor="middle">${DOW1[j]}</text>`);
  return s + `</svg>`;
}
function calendarCard(a,b,counted){
  const first = parseKey(a), lead = (first.getDay()+6)%7, tk = todayKey();
  let s = `<div class="cal">${DOW1.map(d => `<div class="h">${d}</div>`).join('')}${'<div></div>'.repeat(lead)}`;
  range(a,b).forEach(k => {
    const has = counted.has(k), goals = has ? dailyGoals(k) : [], r = goals.length ? goals.filter(x=>x.hit).length/goals.length : 0;
    const strong = r >= .65, bg = has ? `background:color-mix(in srgb, var(--good) ${Math.round(strong ? 70 + r*30 : r*45)}%, var(--chip));color:${strong ? 'var(--cal-hi)' : 'var(--ink)'}` : '';
    const acts = has ? ['run','gym','football'].filter(t => actsOn(k).some(x => x.type===t)) : [];
    const tip = has ? `${fmtDay(k,{weekday:'short',day:'numeric',month:'short'})}: ${goals.filter(x=>x.hit).length}/${goals.length} daily goals${acts.length?' · '+acts.map(t=>ACT[t].name).join(', '):''}` : 'No data';
    s += `<div class="d hit ${has?'':'f'} ${k===tk?'today':''}" style="${bg}" data-tip="${esc(tip)}">${parseKey(k).getDate()}<span class="ds">${acts.map(t => `<i style="background:${ACT[t].color}"></i>`).join('')}</span></div>`;
  });
  s += `</div><div class="legend"><span><i style="background:var(--good)"></i>All daily goals hit</span><span><i style="background:var(--run)"></i>Run</span><span><i style="background:var(--gym)"></i>Gym</span><span><i style="background:var(--foot)"></i>Football</span></div>`;
  return card('This month|day by day', 'Darker = more daily goals hit', s, false, 'cal', 'var(--good)');
}
function weekTable(weeks){
  if (!weeks.length) return `<div class="empty">No weeks yet.</div>`;
  const g = S.settings, mark = ok => ok ? ' ' + OKM : '';
  let s = `<table class="tbl"><tr><th>Week of</th><th>Runs</th><th>km</th><th>Gym</th><th>Football</th></tr>`;
  weeks.forEach(ws => { const p = weekProgress(ws);
    s += `<tr><td>${shortDate(ws)}</td><td>${p.runs}/${g.runGoal}${mark(p.runs>=g.runGoal)}</td><td>${num(p.km)}${mark(g.kmGoal&&p.km>=g.kmGoal)}</td><td>${p.gym}/${g.gymGoal}${mark(gymWeekHit(ws))}</td><td>${p.foot}/${g.footGoal}${mark(footWeekHit(ws))}</td></tr>`; });
  return s + `</table>`;
}
function monthTable(months){
  const ts = shownTrackers();
  let s = `<table class="tbl"><tr><th>Month</th><th>Runs</th><th>km</th><th>Gym</th><th>Foot.</th><th>On time</th>${ts.map(t => `<th title="${esc(t.name)}" aria-label="${esc(t.name)}">${ic(tIc(t), tCol(t), 'xs')}</th>`).join('')}</tr>`;
  months.filter(m => m.days.length).forEach(m => {
    const pc = m.days.map(prayerCounts).reduce((s,c)=>s+c.on,0);
    s += `<tr><td>${MONTHS[m.m]}</td><td>${actsIn(m.a,m.b,'run').length}</td><td>${num(sumKm(actsIn(m.a,m.b,'run')))}</td><td>${actsIn(m.a,m.b,'gym').length}</td><td>${actsIn(m.a,m.b,'football').length}</td><td>${pct(pc,m.days.length*5)}%</td>`
      + ts.map(t => `<td>${t.type==='check' ? m.days.filter(k=>tVal(k,t.id)>0).length+'d' : num(m.days.reduce((s,k)=>s+tVal(k,t.id),0),2)}</td>`).join('') + `</tr>`;
  });
  return s + `</table><div class="foot" style="margin:10px 0 0">On time = prayers on time. Tracker columns use their icons; yes/no trackers show days done (d).</div>`;

async function showPersist(){

}

/* ---------------- sheets ---------------- */
const $sheet = document.getElementById('sheet'), $scrim = document.getElementById('scrim');
let sheetCtx = null;
function openSheet(html, ctx){
  sheetCtx = ctx || {};
  $sheet.innerHTML = `<div class="grab"></div>` + html;
  $sheet.setAttribute('aria-labelledby', 'shTitle'); $sheet.tabIndex = -1; setTimeout(() => $sheet.focus({preventScroll:true}), 60);
  $sheet.hidden = false; $scrim.hidden = false;
  requestAnimationFrame(() => { $sheet.classList.add('show'); $scrim.classList.add('show'); });
}
function closeSheet(){
  $sheet.classList.remove('show'); $scrim.classList.remove('show');
  setTimeout(() => { $sheet.hidden = true; $scrim.hidden = true; $sheet.innerHTML = ''; }, 260);
  sheetCtx = null;
}
function fieldErr(id, msg){
  const f = $sheet.querySelector('#'+id), box = f && f.closest('.field'); if (!box) return toast(msg);
  box.classList.add('err'); box.dataset.err = msg; f.setAttribute('aria-invalid', 'true'); f.focus();
  f.addEventListener('input', () => { box.classList.remove('err'); f.removeAttribute('aria-invalid'); }, {once:true});
}
const fv = id => { const el = $sheet.querySelector('#'+id); return el ? el.value.trim() : ''; };
const fn = (id, d=0) => { const v = parseFloat(fv(id).replace(',','.')); return isFinite(v) ? v : d; };
const head = (title) => `<div class="qhead"><h3 id="shTitle">${title}</h3><button class="circ" data-act="close" aria-label="Close">${I.x}</button></div>`;
const field = (id,label,val,attrs='') => `<label class="field"><span>${label}</span><input id="${id}" value="${esc(val)}" ${attrs}></label>`;
const numField = (id,label,val,dec) => field(id,label,val,`inputmode="${dec?'decimal':'numeric'}" autocomplete="off"`);
const toggle = (id,label,on) => `<div class="tgl"><span>${label}</span><button class="sw ${on?'on':''}" id="${id}" data-act="tgl" role="switch" aria-checked="${!!on}"></button></div>`;
const tglVal = id => $sheet.querySelector('#'+id)?.classList.contains('on');

function actSheet(type, id){
  const ex = id ? S.acts.find(a => a.id === id) : null;
  const a = ex || {type, d: UI.date, km:'', sec:0, split:'Upper', min:'', note:''};
  type = a.type;
  const m = a.sec ? Math.floor(a.sec/60) : '', s = a.sec ? a.sec%60 : '';
  let h = head(ex ? 'Edit activity' : 'Log activity');
  h += typeChips(type, !!ex);
  if (type === 'run'){
    h += numField('fKm','Distance (km)',a.km,true);
    h += `<div class="f2">${numField('fMin','Time — minutes',m)}${numField('fSec','seconds',s)}</div><div class="calc" id="paceOut"></div>`;
  } else if (type === 'gym'){
    h += `<div class="chips">${SPLITS.map(sp => `<button class="${(a.split||'Upper')===sp?'on':''}" data-act="split" data-s="${sp}">${sp}</button>`).join('')}</div>`;
    h += numField('fMinOnly','Duration in minutes (optional)',a.min);
  } else {
    h += numField('fMinOnly','Minutes played',a.min);
  }
  h += field('fDate','Date',a.d,`type="date" max="${todayKey()}"`);
  h += `<label class="field"><span>Note (optional)</span><textarea id="fNote" rows="2" placeholder="e.g. long run, felt good">${esc(a.note||'')}</textarea></label>`;
  h += `<button class="save ${type}" data-act="saveAct">${ex?'Save changes':'Save '+ACT[type].name.toLowerCase()}</button>`;
  if (ex) h += `<button class="danger" data-act="deleteAct">Delete</button>`;
  openSheet(h, {kind:'act', id, type, split: a.split || 'Upper'});
  updatePace();
}
function updatePace(){
  const out = $sheet.querySelector('#paceOut'); if (!out) return;
  const km = fn('fKm'), sec = fn('fMin')*60 + fn('fSec');
  const ws = weekStart(fv('fDate') || UI.date), p = weekProgress(ws), ex = sheetCtx.id ? S.acts.find(a=>a.id===sheetCtx.id) : null;
  const runs = p.runs + (ex && ex.type==='run' && weekStart(ex.d)===ws ? 0 : 1), kmT = p.km - (ex && ex.type==='run' && weekStart(ex.d)===ws ? +ex.km : 0) + km;
  out.innerHTML = `Pace <b style="color:var(--ink)">${pace(sec,km)}</b> · that week becomes ${runs}/${S.settings.runGoal} runs, ${num(kmT)}/${num(S.settings.kmGoal)} km`;
}
function saveAct(){
  const c = sheetCtx, d = fv('fDate') || UI.date;
  if (d > todayKey()) return toast('Can’t log future days');
  const a = {id: c.id || uid(), type: c.type, d, note: fv('fNote'), t: Date.now()};
  if (c.type === 'run'){
    a.km = fn('fKm'); if (!(a.km > 0)) return fieldErr('fKm', 'Enter a distance in km');
    a.sec = Math.round(fn('fMin')*60 + fn('fSec'));
  } else if (c.type === 'gym'){ a.split = c.split; a.min = fn('fMinOnly') || 0; }
  else { a.min = fn('fMinOnly') || 0; }
  if (c.id){ const i = S.acts.findIndex(x => x.id === c.id); if (i >= 0){ a.t = S.acts[i].t || a.t; S.acts[i] = a; } }
  else S.acts.push(a);
  if (d < S.start) S.start = d;
  save(); closeSheet(); render(); toast(`${ACT[a.type].name} saved`);
}

function goalSheet(g){
  const s = S.settings; let h = '';
  if (g === 'water') h = head('Water goal') + numField('gWater','Daily goal (ml)',s.waterGoal) + `<div class="hint">2500 ml = 2.5 L</div>`;
  if (g === 'quick') h = head('Water buttons') + `<div class="f2" style="grid-template-columns:1fr 1fr 1fr">${s.quick.map((q,i) => numField('gQ'+i,`Button ${i+1} (ml)`,q)).join('')}</div>`;
  if (g === 'prayers') h = head('Prayer goal') + `<label class="field"><span>Prayers a day</span><select id="gPr">${[1,2,3,4,5].map(n => `<option ${n===s.prayerGoal?'selected':''}>${n}</option>`).join('')}</select></label>` + toggle('gLate','Late prayers count towards the goal', s.lateCounts) + `<div class="hint">Off: only “On time” counts. On: “On time” and “Late” both count.</div>`;
  if (g === 'run') h = head('Running goal') + `<div class="f2">${numField('gRuns','Runs a week',s.runGoal)}${numField('gKm','km a week',s.kmGoal,true)}</div><div class="hint">Set km to 0 if you only want to count runs.</div>`;
  if (g === 'gym') h = head('Gym goal') + numField('gGym','Sessions a week',s.gymGoal);
  if (g === 'football') h = head('Football goal') + numField('gFoot','Sessions a week',s.footGoal);
  h += `<button class="save" data-act="saveGoal">Save</button>`;
  openSheet(h, {kind:'goal', g});
}
function saveGoal(){
  const s = S.settings, g = sheetCtx.g, int = (id,d,min=0,max=1e6) => Math.max(min, Math.min(max, Math.round(fn(id,d))));
  if (g === 'water') s.waterGoal = int('gWater', s.waterGoal, 0, 20000);
  if (g === 'quick') s.quick = [0,1,2].map(i => int('gQ'+i, s.quick[i], 10, 5000));
  if (g === 'prayers'){ s.prayerGoal = int('gPr', 5, 1, 5); s.lateCounts = !!tglVal('gLate'); }
  if (g === 'run'){ s.runGoal = int('gRuns', s.runGoal, 0, 50); s.kmGoal = Math.max(0, Math.round(fn('gKm', s.kmGoal)*10)/10); }
  if (g === 'gym') s.gymGoal = int('gGym', s.gymGoal, 0, 50);
  if (g === 'football') s.footGoal = int('gFoot', s.footGoal, 0, 50);
  save(); closeSheet(); render(); toast('Goal saved');
}

function trackerSheet(id){
  const t = id ? tById(id) : {id:'', name:'', emoji:'⭐', type:'check', unit:'', step:1, goal:7, period:'day', show:true};
  const type = sheetCtx && sheetCtx.kind==='tracker' && sheetCtx.newType ? sheetCtx.newType : t.type;
  let h = head(id ? 'Edit tracker' : 'New tracker');
  h += `<div class="f2" style="grid-template-columns:72px 1fr">${field('tEmoji','Icon',t.emoji||'','maxlength="4" autocomplete="off"')}${field('tName','Name',t.name,'autocomplete="off" placeholder="e.g. Stretching"')}</div>`;
  if (!id){
    h += `<div class="types">${[['check','Yes / no'],['count','Count'],['amount','Amount']].map(([v,l]) => `<button class="${v===type?'on':''}" data-act="tType" data-v="${v}">${l}</button>`).join('')}</div>`;
  }
  if (type === 'check'){
    h += `<label class="field"><span>Goal</span><select id="tGoal">${[7,6,5,4,3,2,1].map(n => `<option value="${n}" ${n===(+t.goal||7)?'selected':''}>${n===7?'Every day':n+' days a week'}</option>`).join('')}</select></label>`;
  } else {
    h += `<div class="f2">${field('tUnit','Unit',t.unit||(type==='count'?'times':'min'),'autocomplete="off" placeholder="e.g. pages"')}${numField('tStep','+/− step',t.step||1,true)}</div>`;
    h += `<div class="f2">${numField('tGoalN','Goal',t.type===type && t.type!=='check' ? t.goal : (type==='count'?1:30),true)}<label class="field"><span>Per</span><select id="tPer"><option value="day" ${t.period==='day'?'selected':''}>day</option><option value="week" ${t.period==='week'?'selected':''}>week</option></select></label></div>`;
  }
  h += toggle('tShow','Show on Today', t.show !== false);
  h += `<button class="save" data-act="saveTracker">Save</button>`;
  if (id && !t.builtin) h += `<button class="danger" data-act="deleteTracker">Delete tracker</button>`;
  if (id && t.builtin) h += `<div class="hint" style="text-align:center;margin-top:10px">Built-in trackers can be hidden but not deleted.</div>`;
  openSheet(h, {kind:'tracker', id, newType: type});
}
function saveTracker(){
  const c = sheetCtx, name = fv('tName');
  if (!name) return toast('Give it a name');
  const t = c.id ? tById(c.id) : {id:'c_'+uid(), type:c.newType};
  t.name = name.slice(0,30); t.emoji = fv('tEmoji'); t.show = !!tglVal('tShow');
  if (t.type === 'check'){ t.goal = Math.max(1, Math.min(7, parseInt(fv('tGoal'))||7)); t.period = 'week'; }
  else { t.unit = fv('tUnit').slice(0,12); t.step = Math.max(0.01, fn('tStep',1)); t.goal = Math.max(0, fn('tGoalN',1)); t.period = fv('tPer') === 'week' ? 'week' : 'day'; }
  if (!c.id) S.settings.trackers.push(t);
  save(); closeSheet(); render(); toast('Tracker saved');
}

/* ---------------- backup / restore / csv ---------------- */
async function shareOrDownload(name, text, mime){
  const blob = new Blob([text], {type:mime});
  try {
    const file = new File([blob], name, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return true; }
  } catch(e){ if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
async function backup(){
  const payload = JSON.stringify({app:'lifelog', version:VERSION, exported:new Date().toISOString(), data:S});
  const ok = await shareOrDownload(`lifelog-backup-${todayKey()}.json`, payload, 'application/json');
  if (ok){ S.settings.lastBackup = new Date().toISOString(); save(); render(); toast('Backup saved'); }
}
function restoreFile(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result), data = j && j.app === 'lifelog' ? j.data : j;
      if (!data || typeof data.days !== 'object' || !data.settings) throw new Error('bad');
      const nDays = Object.keys(data.days).length;
      if (!confirm(`Restore this backup${j.exported?` from ${new Date(j.exported).toLocaleDateString('en-GB')}`:''}? (${nDays} days of data)\n\nThis replaces everything currently in the app.`)) return;
      S = normalise(data); save(); UI.date = todayKey(); render(); toast('Backup restored');
    } catch(e){ alert('That file isn’t a Life Log backup.'); }
  };
  r.readAsText(file);
}
function csv(){
  const ts = trackers(), cell = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const label = {on:'on time', late:'late', missed:'missed'};
  const rows = [['date','water_ml',...PRAYERS.map(p=>p[0]),...ts.map(t => t.name + (t.type==='check'?' (1=yes)':t.unit?` (${t.unit})`:'')),'runs','run_km','run_minutes','gym_sessions','gym_type','football_sessions','football_minutes','notes']];
  range(S.start, todayKey()).forEach(k => {
    const ac = actsOn(k), r = ac.filter(a=>a.type==='run'), gy = ac.filter(a=>a.type==='gym'), fo = ac.filter(a=>a.type==='football');
    rows.push([k, waterTotal(k), ...PRAYERS.map(([id]) => label[(day(k).p||{})[id]]||''), ...ts.map(t => tVal(k,t.id)),
      r.length, num(sumKm(r),2), Math.round(r.reduce((s,a)=>s+(a.sec||0),0)/60), gy.length, gy.map(a=>a.split).join(' + '), fo.length, sumMin(fo), ac.map(a=>a.note).filter(Boolean).join(' | ')]);
  });
  shareOrDownload(`lifelog-${todayKey()}.csv`, rows.map(r => r.map(cell).join(',')).join('\n'), 'text/csv');
}

/* ---------------- tooltip & toast ---------------- */
const $tip = document.getElementById('tip'), $toast = document.getElementById('toast');
function showTip(el){
  const r = el.getBoundingClientRect();
  $tip.textContent = el.dataset.tip; $tip.hidden = false;
  const x = Math.max(80, Math.min(innerWidth-80, r.left + r.width/2));
  $tip.style.left = x + 'px'; $tip.style.top = Math.max(50, r.top - 6) + 'px';
}
function hideTip(){ $tip.hidden = true; }
let toastT;
let toastUndo = null;
function toast(msg, undo){
  toastUndo = undo || null;
  $toast.innerHTML = esc(msg) + (undo ? ' <button type="button" id="toastUndo">Undo</button>' : '');
  $toast.classList.toggle('act', !!undo); $toast.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => { $toast.classList.remove('show'); toastUndo = null; }, undo ? 4000 : 1800);
}
$toast.addEventListener('click', e => { if (e.target.id === 'toastUndo' && toastUndo){ const f = toastUndo; toastUndo = null; f(); $toast.classList.remove('show'); } });

/* ---------------- actions ---------------- */
const A = {
  tab: el => { UI.tab = el.dataset.tab; render(); scrollTo(0,0); syncTopbar(); },
  prevDay: () => { UI.date = addDays(UI.date,-1); render(); },
  nextDay: () => { if (UI.date < todayKey()){ UI.date = addDays(UI.date,1); render(); } },
  goToday: () => { UI.date = todayKey(); render(); },
  water: el => { dayW(UI.date).w.push([Date.now(), +el.dataset.ml]); save(); render(); },
  waterOther: () => openSheet(head('Add water') + numField('fMl','Amount (ml)','') + `<button class="save" data-act="saveWater">Add</button>`, {kind:'water'}),
  saveWater: () => { const ml = Math.round(fn('fMl')); if (!(ml > 0)) return fieldErr('fMl', 'Enter an amount in ml'); dayW(UI.date).w.push([Date.now(), ml]); save(); closeSheet(); render(); },
  undoWater: () => { const w = dayW(UI.date).w; if (!w.length) return; let i = 0; w.forEach((e,j) => { if (e[0] >= w[i][0]) i = j; }); const [, ml] = w.splice(i,1)[0]; save(); render(); toast(`Removed ${ml} ml`); },
  delWater: el => { const k = UI.date, w = dayW(k).w, i = w.findIndex(e => String(e[0]) === el.dataset.t); if (i >= 0){ const [gone] = w.splice(i,1); save(); render(); toast(`Removed ${gone[1]} ml`, () => { dayW(k).w.push(gone); save(); render(); }); } },
  prayer: el => { const p = dayW(UI.date).p, id = el.dataset.p, s = el.dataset.s; if (p[id] === s) delete p[id]; else p[id] = s; save(); render(); },
  check: el => { const v = dayW(UI.date).v, id = el.dataset.id; if (v[id]) delete v[id]; else v[id] = 1; save(); render(); },
  step: el => { const t = tById(el.dataset.id), v = dayW(UI.date).v; const nv = Math.max(0, Math.round(((+v[t.id]||0) + (+el.dataset.dir)*(t.step||1))*100)/100); if (nv) v[t.id] = nv; else delete v[t.id]; save(); render(); if (sheetCtx && sheetCtx.kind === 'tstep') $sheet.querySelector('#tsv').textContent = num(tVal(UI.date, t.id), 2); },
  addAct: el => actSheet(el.dataset.type),
  pcycle: el => { const p = dayW(UI.date).p, id = el.dataset.p; if (!p[id]){ p[id] = 'on'; save(); render(); } else prayerSheet(id); },
  pset: el => { const p = dayW(UI.date).p, id = el.dataset.p, st = el.dataset.s; if (st) p[id] = st; else delete p[id]; save(); closeSheet(); render(); },
  markRest: () => { const p = dayW(UI.date).p, ids = PRAYERS.map(x => x[0]).filter(id => !p[id]); ids.forEach(id => p[id] = 'missed'); save(); render(); toast(`${plural(ids.length,'prayer')} marked missed`, () => { ids.forEach(id => delete dayW(UI.date).p[id]); save(); render(); }); },
  card: el => { UI.card = +el.dataset.i; render(); },
  toStreaks: () => { const e = document.getElementById('streaks'); if (e) e.scrollIntoView({behavior:'smooth', block:'start'}); },
  quick: () => quickSheet(),
  key: el => { const c = sheetCtx; if (!c) return; const kk = el.dataset.k; c.kv = kk === 'del' ? (c.kv||'').slice(0,-1) : ((c.kv||'') + kk).replace(/^0+/,'').slice(0,4); syncQuick(); },
  kPreset: el => { if (!sheetCtx) return; sheetCtx.kv = el.dataset.ml; syncQuick(); },
  kAdd: () => { const ml = +((sheetCtx && sheetCtx.kv) || 0); if (!(ml > 0)) return toast('Type an amount first'); dayW(UI.date).w.push([Date.now(), ml]); save(); closeSheet(); render(); toast(`Added ${ml} ml`); },
  kUndo: () => { A.undoWater(); syncQuick(); },
  tStep: el => stepSheet(el.dataset.id),
  setPart: el => { UI.set = el.dataset.p; render(); },
  editAct: el => actSheet(null, el.dataset.id),
  delAct: el => { if (!confirm('Delete this activity?')) return; S.acts = S.acts.filter(a => a.id !== el.dataset.id); save(); render(); },
  actType: el => { const c = sheetCtx; if (c.id){ const a = S.acts.find(x => x.id === c.id); if (a && a.type !== el.dataset.type){ toast('Delete and re-add to change type'); return; } } actSheet(el.dataset.type); },
  split: el => { sheetCtx.split = el.dataset.s; $sheet.querySelectorAll('.chips button').forEach(b => b.classList.toggle('on', b === el)); },
  saveAct, deleteAct: () => { if (!confirm('Delete this activity?')) return; S.acts = S.acts.filter(a => a.id !== sheetCtx.id); save(); closeSheet(); render(); },
  close: closeSheet,
  tgl: el => { el.classList.toggle('on'); el.setAttribute('aria-checked', el.classList.contains('on')); },
  per: el => { UI.per = el.dataset.p; UI.anchor = todayKey(); render(); },
  prevPer: () => shiftPer(-1), nextPer: () => shiftPer(1),
  goal: el => goalSheet(el.dataset.g), saveGoal,
  tracker: el => trackerSheet(el.dataset.id || null),
  tType: el => { sheetCtx.newType = el.dataset.v; const name = fv('tName'), emoji = fv('tEmoji'); trackerSheet(null); $sheet.querySelector('#tName').value = name; $sheet.querySelector('#tEmoji').value = emoji; },
  saveTracker,
  deleteTracker: () => { const t = tById(sheetCtx.id); if (!confirm(`Delete “${t.name}” and all its logged data?`)) return; S.settings.trackers = trackers().filter(x => x.id !== t.id); Object.values(S.days).forEach(d => d.v && delete d.v[t.id]); save(); closeSheet(); render(); },
  dismissInstall: () => { S.settings.installDismissed = true; save(); render(); },
  backup, restore: () => document.getElementById('fileIn').click(), csv,
  erase: () => { if (!confirm('Erase ALL data and settings? This can’t be undone.')) return; if (!confirm('Are you sure? Make a backup first if you might want this data.')) return; S = defaults(); save(); UI.date = todayKey(); render(); toast('All data erased'); }
};
function shiftPer(dir){
  const d = parseKey(UI.anchor);
  if (UI.per === 'week') UI.anchor = addDays(UI.anchor, 7*dir);
  else if (UI.per === 'month') UI.anchor = keyOf(new Date(d.getFullYear(), d.getMonth()+dir, 1));
  else UI.anchor = keyOf(new Date(d.getFullYear()+dir, 0, 1));
  if (UI.anchor > todayKey()) UI.anchor = todayKey();
  render();
}

document.addEventListener('click', e => {
  const tipEl = e.target.closest('[data-tip]');
  const el = e.target.closest('[data-act],[data-tab]');
  if (tipEl && !el){ showTip(tipEl); return; }
  hideTip();
  if (!el) return;
  if (el.dataset.tab) return A.tab(el);
  const fnc = A[el.dataset.act]; if (fnc){ e.preventDefault(); fnc(el); }
});
$scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetCtx) closeSheet(); });
$sheet.addEventListener('input', e => { if (['fKm','fMin','fSec','fDate'].includes(e.target.id)) updatePace(); });
document.getElementById('fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) restoreFile(f); e.target.value = ''; });
addEventListener('scroll', () => { hideTip(); $topbar.classList.toggle('show', scrollY > 56); }, {passive:true});
addEventListener('resize', placeBubble);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const tk = todayKey();
  if (tk !== UI.lastToday){ UI.date = tk; UI.lastToday = tk; UI.card = 0; }
  try { const fresh = localStorage.getItem(KEY); if (fresh) S = normalise(JSON.parse(fresh)); } catch(e){}
  if (!sheetCtx) render();
});

/* ---------------- start ---------------- */
try { if (!localStorage.getItem(KEY)) save(); } catch(e){}
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
