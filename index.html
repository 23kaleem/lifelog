<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Log</title>
<meta name="description" content="Personal daily tracker: water, prayers, Quran, training and habits.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Log">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{
  color-scheme:light;
  --page:#f2f2f7;
  --card:#ffffff; --card-line:rgba(0,0,0,.05); --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);
  --ink:#0b0b0f; --ink2:#55555c; --muted:#6c6c72;
  --line:rgba(60,60,67,.12); --chip:#ececf0; --chip2:#e3e3e8; --track:#e9e9ee;
  --sheet:#ffffff; --scrim:rgba(0,0,0,.32);
  --water:#2a78d6; --prayer:#0ca30c; --run:#eb6834; --gym:#1baf7a; --foot:#4a3aa7;
  --quran:#d98a00; --creatine:#7b5cd6; --skincare:#d6457f; --habit:#3d5afe;
  --good:#0ca30c; --warn:#fab219; --bad:#d03b3b; --none:#d1d1d6;
  --good-ink:#0a7d0a; --bad-ink:#b42e2e;
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.12); --onaccent:#ffffff;
  --banner:#fff6e0; --bannerline:#f3dc9c;
  --glass:rgba(255,255,255,.62); --glass-line:rgba(255,255,255,.75); --glass-edge:rgba(0,0,0,.06);
  --glass-shadow:0 1px 1px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.12); --glass-hi:inset 0 1px 0 rgba(255,255,255,.85);
  --bubble:rgba(0,0,0,.065); --segon:#ffffff; --well:#f4f4f7;
  --em:#1f6cc9; --cal-hi:#0b0b0f; --chipon:#ffffff; --chipshadow:0 1px 3px rgba(0,0,0,.1),0 1px 1px rgba(0,0,0,.04);
  --grey:#8e8e93; --hm-hi:#0b0b0f;
  --on-fill:#0a7f0a; --on-text:#ffffff; --miss-fill:#d03b3b; --accent-fill:#1f6cc9; --run-fill:#bd4f1d; --gym-fill:#0f7b54; --foot-fill:#4a3aa7; --run-ink:#a84014; --gym-ink:#0b6e49;
  --tint-a:.13;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#000000;
    --card:#1c1c1e; --card-line:rgba(255,255,255,.06); --shadow:0 1px 0 rgba(255,255,255,.03) inset;
    --ink:#f5f5f7; --ink2:#b4b4bb; --muted:#9a9aa2;
    --line:rgba(84,84,88,.5); --chip:#2c2c2e; --chip2:#1c1c1e; --track:#2c2c2e;
    --sheet:#1c1c1e; --scrim:rgba(0,0,0,.6);
    --water:#3d8ff0; --prayer:#30c048; --run:#f0743f; --gym:#25c48a; --foot:#9085e9;
    --quran:#f0a52a; --creatine:#9b82f0; --skincare:#ee6a9c; --habit:#6f86ff;
    --good:#30c048; --warn:#fab219; --bad:#ef4f4f; --none:#3a3a3f;
    --good-ink:#5ad66e; --bad-ink:#ff7b7b;
    --accent:#3d8ff0; --accent-soft:rgba(61,143,240,.18);
    --banner:#2e2610; --bannerline:#5a4a1c;
    --glass:rgba(38,38,44,.55); --glass-line:rgba(255,255,255,.14); --glass-edge:rgba(255,255,255,.06);
    --glass-shadow:0 10px 30px rgba(0,0,0,.5); --glass-hi:inset 0 1px 0 rgba(255,255,255,.12);
    --bubble:rgba(255,255,255,.12); --segon:#48484e; --well:#2c2c2e;
    --em:#4a9bf5; --cal-hi:#04210a; --chipon:#2c2c2e; --chipshadow:none;
    --grey:#636366; --hm-hi:#04210a;
  --on-fill:#30c048; --on-text:#04210a; --miss-fill:#d63a3a; --accent-fill:#2a6fd0; --run-fill:#bd4f1d; --gym-fill:#0f7b54; --foot-fill:#4a3aa7; --run-ink:#ff9a6b; --gym-ink:#4fe0a8;
    --tint-a:.2;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#000000;
  --card:#1c1c1e; --card-line:rgba(255,255,255,.06); --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --ink:#f5f5f7; --ink2:#b4b4bb; --muted:#9a9aa2;
  --line:rgba(84,84,88,.5); --chip:#2c2c2e; --chip2:#1c1c1e; --track:#2c2c2e;
  --sheet:#1c1c1e; --scrim:rgba(0,0,0,.6);
  --water:#3d8ff0; --prayer:#30c048; --run:#f0743f; --gym:#25c48a; --foot:#9085e9;
  --quran:#f0a52a; --creatine:#9b82f0; --skincare:#ee6a9c; --habit:#6f86ff;
  --good:#30c048; --warn:#fab219; --bad:#ef4f4f; --none:#3a3a3f;
  --good-ink:#5ad66e; --bad-ink:#ff7b7b;
  --accent:#3d8ff0; --accent-soft:rgba(61,143,240,.18);
  --banner:#2e2610; --bannerline:#5a4a1c;
  --glass:rgba(38,38,44,.55); --glass-line:rgba(255,255,255,.14); --glass-edge:rgba(255,255,255,.06);
  --glass-shadow:0 10px 30px rgba(0,0,0,.5); --glass-hi:inset 0 1px 0 rgba(255,255,255,.12);
  --bubble:rgba(255,255,255,.12); --segon:#48484e; --well:#2c2c2e;
  --em:#4a9bf5; --cal-hi:#04210a; --chipon:#2c2c2e; --chipshadow:none;
  --grey:#636366; --hm-hi:#04210a;
  --on-fill:#30c048; --on-text:#04210a; --miss-fill:#d63a3a; --accent-fill:#2a6fd0; --run-fill:#bd4f1d; --gym-fill:#0f7b54; --foot-fill:#4a3aa7; --run-ink:#ff9a6b; --gym-ink:#4fe0a8;
  --tint-a:.2;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--page)}
body{background:var(--page);color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;caret-color:var(--accent)}
::selection{background:var(--accent-soft);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
[hidden]{display:none!important}
.num{font-family:var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}

/* glass (floating controls only) */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-line);box-shadow:var(--glass-hi),var(--glass-shadow)}

/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin:10px 4px 18px;gap:10px}
.hdr h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.hdr .sub{font-size:15px;color:var(--ink2);margin-top:4px;font-weight:500}
.arrows{display:flex;gap:8px;align-items:center;padding-bottom:2px}
.circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-line);box-shadow:var(--glass-hi),0 1px 1px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.08);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.circ svg{width:18px;height:18px}
.circ:disabled{opacity:.35;box-shadow:none}
.todaybtn{font-size:14px;font-weight:600;color:var(--em);height:40px;padding:0 15px;border-radius:20px;
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-line);box-shadow:var(--glass-hi),0 4px 14px rgba(0,0,0,.08)}

/* top bar that appears on scroll */
.topbar{position:fixed;top:0;left:0;right:0;z-index:25;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;text-align:center;font-size:17px;font-weight:700;
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--glass-edge);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .22s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
.topbar.show{opacity:1;transform:none}

/* cards */
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;border:1px solid var(--card-line);box-shadow:var(--shadow)}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;min-height:30px}
.ct b{font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex:none;white-space:nowrap}
.ct > span{font-size:14px;color:var(--ink2);text-align:right}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;position:relative;color:var(--c)}
.ic::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);opacity:var(--tint-a)}
.ic svg{width:18px;height:18px;position:relative}
.ic .em{position:relative;font-size:16px;line-height:1}
.ic.lg{width:36px;height:36px;border-radius:11px}.ic.lg svg{width:20px;height:20px}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;display:grid;place-items:center;height:46px;font-size:16px;font-weight:700;border-radius:23px;background:var(--chip);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.btn.pri{background:var(--accent-fill);color:#fff;font-family:var(--round)}
.btn.ghost{flex:0 0 46px;color:var(--ink)}
.btn.ghost svg{width:20px;height:20px}
.btn:disabled{opacity:.4}
.btn:active,.circ:active,.add:active,.segb:active,.todaybtn:active,.more:active,.stepper button:active{transform:scale(.94)}
.ok{color:var(--good-ink);font-weight:700;display:inline-flex;vertical-align:-2px}
.ok svg{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:13px}
.pill svg{width:13px;height:13px}
.pill.good{color:var(--good-ink);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.open{color:var(--ink2);background:var(--chip)}

/* hero */
.hero{display:flex;align-items:center;gap:18px;padding:18px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;display:block}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--round);font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .c small{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-top:2px}
.hero h2{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.hero .sub{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.35}
.hero .sub b{color:var(--ink);font-weight:600}

/* water */
.amt{display:flex;align-items:baseline;gap:6px;margin:-2px 0 12px}
.amt .big{font-family:var(--round);font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.amt .unit{font-family:var(--round);font-size:20px;font-weight:700;color:var(--ink2)}
.amt .of{font-size:15px;color:var(--ink2);margin-left:4px}

/* prayers */
.pr{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:10px}
.pr .n{font-size:16px;font-weight:500}
.seg{display:flex;gap:2px;background:var(--chip);border-radius:12px;padding:3px}
.segb{font-size:13px;font-weight:600;padding:8px 10px;border-radius:9px;color:var(--ink2);white-space:nowrap;transition:background .2s,color .2s,transform .2s}
.segb.s-on{background:var(--on-fill);color:var(--on-text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.segb.s-late{background:var(--warn);color:#2b2100;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.segb.s-miss{background:var(--miss-fill);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* habits */
.hrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:12px;min-height:56px}
.hrow + .hrow{border-top:1px solid var(--line)}
.hl{display:flex;align-items:center;gap:12px;min-width:0}
.hname{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.hgoal{font-size:13px;color:var(--ink2);margin-top:1px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.stepper button svg{width:16px;height:16px}
.stepper b{font-family:var(--round);font-size:22px;font-weight:800;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.sw{width:51px;height:31px;border-radius:16px;background:var(--none);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:left .3s cubic-bezier(.2,.8,.2,1)}
.sw.on{background:var(--good)}.sw.on::after{left:22px}

/* week */
.wk{display:flex;flex-direction:column}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.wrow + .wrow{border-top:1px solid var(--line)}
.wrow .wm{flex:1;min-width:0}
.wrow .lbl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:16px;font-weight:600;margin-bottom:7px}
.wrow .lbl .v{font-family:var(--round);font-weight:700;font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrow .bar{height:7px}
.wrow .small{font-size:13px;color:var(--ink2);margin-top:5px}
.add{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--ci,var(--c,var(--accent)));height:34px;padding:0 13px;border-radius:17px;white-space:nowrap;position:relative;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.add::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c,var(--accent));opacity:var(--tint-a)}
.add svg{width:14px;height:14px;position:relative}.add span{position:relative}
.more{width:100%;margin-top:6px;height:44px;border-radius:14px;background:var(--chip);font-size:15px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .2s}
.more svg{width:16px;height:16px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* streaks */
.str{display:flex;align-items:center;gap:12px;padding:9px 0;min-height:52px}
.str + .str{border-top:1px solid var(--line)}
.str .nm{flex:1;min-width:0;font-size:16px;font-weight:600}
.str .v{font-family:var(--round);font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.str .v small{font-size:14px;font-weight:700;color:var(--ink2);margin-left:3px;letter-spacing:0}

/* log list */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:15px}
.li + .li{border-top:1px solid var(--line)}
.li .main{flex:1;min-width:0;font-weight:600;text-align:left}
.li .meta{font-size:13px;color:var(--ink2);font-weight:400;margin-top:1px}
.li .x{width:30px;height:30px;border-radius:50%;background:var(--chip);color:var(--ink2);flex:none;display:grid;place-items:center}
.li .x svg{width:12px;height:12px}
.empty{font-size:14px;color:var(--ink2);padding:2px 0;line-height:1.4}

/* summary */
.segctl{display:flex;border-radius:14px;padding:3px;margin-bottom:14px;background:var(--chip2)}
.segctl button{flex:1;text-align:center;font-size:14px;padding:8px 0;border-radius:11px;color:var(--ink2);font-weight:600}
.segctl .on{background:var(--segon);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tiles > .tile:last-child:nth-child(odd){grid-column:1/-1}
.tile{background:var(--card);border-radius:18px;padding:11px 12px 12px;border:1px solid var(--card-line);box-shadow:var(--shadow)}
.tile .l{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;font-weight:500;min-height:24px}
.tile .v{font-family:var(--round);font-size:22px;font-weight:800;margin-top:5px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .g{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.3;text-wrap:balance}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:inherit}
.ax{font-size:12px;fill:var(--ink2);font-weight:500}
.lab{font-size:13px;fill:var(--ink);font-weight:500}
.val.halo{paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round}
.val{font-size:12px;fill:var(--ink2);font-family:var(--round);font-weight:700;font-variant-numeric:tabular-nums}
.hit{cursor:pointer}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--card);font-size:12.5px;padding:7px 10px;border-radius:10px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 6px 18px rgba(0,0,0,.2)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11.5px;color:var(--ink2);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.note{font-size:12.5px;color:var(--ink2);text-align:center;margin:6px 0 12px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--ink2);text-align:center;padding-bottom:2px;font-weight:600}
.cal .d{aspect-ratio:1;border-radius:10px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;background:var(--chip)}
.cal .d.f{opacity:.35}
.cal .d .ds{display:flex;gap:2px;position:absolute;bottom:3px;background:var(--card);padding:2px 3px;border-radius:5px}
.cal .d .ds:empty{display:none}
.cal .d .ds i{width:5px;height:5px;border-radius:50%}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}

/* settings */
.banner{background:var(--banner);border:1px solid var(--bannerline);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{color:var(--em);font-weight:700;white-space:nowrap}
.sh{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:22px 16px 7px;font-weight:500}
.set{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--card-line);box-shadow:var(--shadow)}
.set .r{display:flex;justify-content:space-between;align-items:center;font-size:16px;width:100%;text-align:left;min-height:52px}
.set .r:last-child{border-bottom:0}
.set .r em{font-style:normal;color:var(--ink2);text-align:right}
.set .r.blue{color:var(--em);font-weight:600}
.set .r.red{color:var(--bad-ink);font-weight:600}
.foot{font-size:13px;color:var(--ink2);margin:8px 16px 0;line-height:1.4}

/* icon tile sizes and the solid (Settings) variant */
.ic.sm{width:24px;height:24px;border-radius:7px}.ic.sm svg{width:14px;height:14px}.ic.sm .em{font-size:13px}
.ic.xs{width:22px;height:22px;border-radius:6px;display:inline-grid;vertical-align:middle}.ic.xs svg{width:13px;height:13px}.ic.xs .em{font-size:12px}
.ic.solid{color:#fff;width:30px;height:30px;border-radius:8px}.ic.solid::before{opacity:1}.ic.solid svg{width:18px;height:18px}
.tile .v small{font-size:14px;font-weight:700;color:var(--ink2);letter-spacing:0}
.tile .v .ok{margin-left:6px;vertical-align:1px}
.tile .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrollx{overflow-x:auto;margin:0 -16px;padding:0 16px}
.banner .bl{display:flex;align-items:center;gap:10px}
.app-card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px 16px;border:1px solid var(--card-line);box-shadow:var(--shadow)}
.app-card img{width:60px;height:60px;border-radius:14px;flex:none;box-shadow:0 0 0 1px var(--card-line),0 2px 6px rgba(0,0,0,.12)}
.app-card b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.app-card .sub{font-size:13.5px;color:var(--ink2);margin-top:2px}
.set .r{gap:12px;padding:10px 14px 10px 14px;border-bottom:0;position:relative}
.set .r + .r::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--line)}
.set .r .rl{flex:1;min-width:0}
.set .r em{font-size:15px;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set .r .chev{color:var(--muted);display:grid;margin-left:-4px}.set .r .chev svg{width:14px;height:14px}

/* summary: comparison badges, weekday heatmap, drink curve, pace, streak records, year, gym split */
.trend{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;flex:none;margin-left:auto}
.trend svg{width:12px;height:12px}
.trend.up{color:var(--good-ink);background:color-mix(in srgb,var(--good) 15%,transparent)}
.trend.down{color:var(--bad-ink);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.trend.flat{color:var(--ink2);background:var(--chip)}
.cmpnote{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin:-4px 4px 10px;line-height:1.3}
.cmpnote .trend{width:18px;height:18px;margin:0}.cmpnote .trend svg{width:10px;height:10px}
.cmpnote span:last-child{margin-left:2px}
.hm{display:grid;grid-template-columns:60px repeat(8,1fr);gap:4px;align-items:center}
.hm .h{font-size:12px;font-weight:600;color:var(--ink2);text-align:center}
.hm .n{font-size:13px;font-weight:600}
.hm .c{height:32px;border-radius:8px;display:grid;place-items:center;font-family:var(--round);font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.hm .c.none{background:var(--track);color:var(--ink2);opacity:.6}
.hm .c.all{box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.scale{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:12px}
.scale i{width:18px;height:10px;border-radius:3px;display:inline-block}
.scale .tr{margin-left:auto}
.callout{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 12px;border-radius:14px;background:color-mix(in srgb,var(--bad) 10%,transparent);color:var(--bad-ink);font-size:14px;font-weight:600;line-height:1.3}
.callout svg{width:18px;height:18px;flex:none}
.chips2{display:flex;gap:8px;margin-top:12px}
.chip2{flex:1;min-width:0;background:var(--well);border-radius:14px;padding:10px 12px}
.chip2 .v{font-family:var(--round);font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip2 .v small{font-size:13px;color:var(--ink2);font-weight:700;margin-left:2px;letter-spacing:0}
.chip2 .l{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.3}
.pbh{font-size:13px;font-weight:600;color:var(--ink2);margin-top:14px}
.pbh + .chips2{margin-top:8px}
.note.left{text-align:left;margin:8px 0 0}
.legend .dash{width:14px;height:0;border-top:2px dashed var(--ink2);border-radius:0;background:none}
.sr{display:flex;align-items:center;gap:12px;padding:10px 0}
.sr + .sr{border-top:1px solid var(--line)}
.sr .m{flex:1;min-width:0}
.sr .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.sr .t .nm{font-size:15px;font-weight:600;min-width:0}
.sr .t .v{font-family:var(--round);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sr .t .v small{color:var(--ink2);font-weight:700;font-size:13px}
.sb{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.sb i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.rec{display:inline-block;font-size:11.5px;font-weight:700;color:var(--good-ink);background:color-mix(in srgb,var(--good) 14%,transparent);padding:2px 7px;border-radius:8px;vertical-align:1px}
.str .nm small{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-top:1px}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px}
.mo .mn{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.mo .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mo .g i{aspect-ratio:1;border-radius:2px;display:block}
.mo .g i.off{background:var(--track);opacity:.45}
.mo .g i.now{outline:1.5px solid var(--ink);outline-offset:0}
.split{display:flex;height:36px;border-radius:11px;overflow:hidden;gap:2px}
.split div{display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;white-space:nowrap;min-width:66px;padding:0 6px}
.splitk{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px;color:var(--ink2)}
.splitk b{color:var(--ink);font-family:var(--round)}

/* ===== bold style (1.3.0): big two-tone headings, card stack, circles, pill chips ===== */
.topnav{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.datepill{flex:1;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--card-line);display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:15px;font-weight:600;box-shadow:var(--shadow)}
.datepill span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datepill .dp{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.datepill .dp svg{width:16px;height:16px}.datepill .dp:disabled{opacity:.3}
.circ.flame{position:relative;width:44px;height:44px;color:var(--run)}
.circ.flame svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--run-fill);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--page)}
h1.tt{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.08;margin:2px 2px 6px;text-wrap:balance}
h1.tt em,h2.sec em{font-style:normal;color:var(--em)}
h1.tt.solo{margin:14px 2px 14px}
h2.sec{font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.15;margin:26px 2px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2.sec .ok svg{width:18px;height:18px}
.card > .cap{font-size:13px;color:var(--ink2);margin:-2px 0 10px;font-weight:500}

/* card stack */
.stack{position:relative;height:296px;margin:16px 4px 10px;touch-action:pan-y}
.sc{position:absolute;inset:0 26px;border-radius:30px;color:#fff;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s,filter .3s;will-change:transform}
.sc .sc-in{transition:opacity .3s;height:100%;padding:18px 18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.sc.pos0{z-index:3;box-shadow:0 18px 44px rgba(0,0,0,.35)}
.sc.pos1{z-index:2;transform:rotate(6deg) translateX(28px) scale(.93)}
.sc.pos2{z-index:1;transform:rotate(-6deg) translateX(-28px) scale(.93)}
.sc.pos1 .sc-in,.sc.pos2 .sc-in{pointer-events:none;opacity:.0}
.sc.pos1,.sc.pos2{cursor:pointer}
.sc-water{background:linear-gradient(180deg,#2a6fd0,#1c58b8)}
.sc-goals{background:linear-gradient(180deg,#0f7f37,#0a6a2c)}
.sc-week{background:linear-gradient(180deg,#c4531f,#a8441a)}
.sc .sch{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sc .tag{margin-top:9px;font-size:13px;font-weight:700;background:rgba(0,0,0,.22);padding:5px 11px;border-radius:10px}
.sc .big{font-size:56px;font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:14px}
.sc .big small{font-size:22px;opacity:.8;margin-left:4px;letter-spacing:0}
.sc .track{width:100%;height:10px;border-radius:5px;background:rgba(255,255,255,.25);margin-top:20px;overflow:hidden}
.sc .track i{display:block;height:100%;background:#fff;border-radius:5px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.sc .track.thin{height:7px;margin-top:7px}
.sc .qrow{display:flex;gap:8px;width:100%;margin-top:auto}
.sc .qb{flex:1;height:46px;border-radius:23px;background:#fff;color:#123e86;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.sc-week .qb{color:#8a3613}.sc-goals .qb{color:#0a6a2c}
.sc .qb svg{width:15px;height:15px}
.sc .qrow.sm{margin-top:10px}
.sc .qs{flex:1;height:36px;border-radius:18px;background:rgba(0,0,0,.2);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.sc .qs svg{width:15px;height:15px}.sc .qs:disabled{opacity:.45}
.sc .qb:active,.sc .qs:active,.ci:active .o,.pc:active .o{transform:scale(.94)}
.big-ring{width:128px;height:128px;margin-top:12px;position:relative}
.big-ring svg{width:100%;height:100%}
.big-ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.big-ring .c b{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1}
.big-ring .c small{display:block;font-size:13px;font-weight:700;opacity:.85;margin-top:2px}
.sc-note{margin-top:auto;font-size:15px;line-height:1.35;opacity:.95}
.wk2{width:100%;margin-top:16px;text-align:left;display:flex;flex-direction:column;gap:12px}
.wr .wl{display:flex;justify-content:space-between;font-size:16px;font-weight:700}
.wr .wx{font-size:13px;opacity:.85;margin-top:4px}
.dots{display:flex;justify-content:center;gap:4px;margin:2px 0 0}
.dots button{width:22px;height:22px;display:grid;place-items:center}
.dots button::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--none);transition:background .2s,width .2s}
.dots button.on::after{background:var(--ink);width:18px;border-radius:4px}

/* circles row */
.crow{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.crow::-webkit-scrollbar{display:none}
.ci{width:72px;flex:none;text-align:center}
.ci .o{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;position:relative;color:var(--c);transition:transform .2s cubic-bezier(.2,.8,.2,1),background .25s}
.ci .o::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);opacity:var(--tint-a);transition:opacity .25s}
.ci.done .o{color:#fff}.ci.done .o::before{opacity:1}
.ci .o svg{width:27px;height:27px;position:relative}
.ci .o .em{position:relative;font-size:26px}
.ci .o .ck{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--on-fill);color:var(--on-text);border:3px solid var(--page);display:grid;place-items:center}
.ci .o .ck svg{width:11px;height:11px}
.ci b{display:block;font-size:13px;margin-top:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .s{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.ci .s.hit{color:var(--good-ink);font-weight:600}
.ci.newt .o{color:var(--ink2);box-shadow:inset 0 0 0 2px var(--line)}.ci.newt .o::before{opacity:0}

/* prayer circles */
.prow{display:flex;justify-content:space-between;padding:16px 8px}
.pc{width:64px;text-align:center}
.pc .o{width:52px;height:52px;border-radius:50%;margin:0 auto;display:grid;place-items:center;transition:background .25s,color .25s,box-shadow .25s,transform .2s}
.pc .o svg{width:22px;height:22px}
.pc .o.s-on{background:var(--on-fill);color:var(--on-text)}
.pc .o.s-late{background:var(--warn);color:#2b2100}
.pc .o.s-miss{background:var(--miss-fill);color:#fff}
.pc .o.open{box-shadow:inset 0 0 0 2px var(--line);color:var(--ink2)}
.pc b{display:block;font-size:13px;margin-top:7px;font-weight:600}
.pc span{display:block;font-size:11.5px;color:var(--ink2);white-space:nowrap;letter-spacing:-.01em}
.hint2{font-size:12.5px;color:var(--ink2);margin:8px 4px 0}

/* pill chips (Summary period, Settings sections, quick log types) */
.chips{display:flex;gap:6px;flex-wrap:nowrap;margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.chips button{height:38px;padding:0 16px;border-radius:19px;font-size:15px;font-weight:600;color:var(--ink2);background:none;flex:none}
.chips button.on{background:var(--chipon);color:var(--ink);box-shadow:var(--chipshadow)}

/* sky cards (Summary hero, Settings app card) */
.sky{background:linear-gradient(180deg,#6cc8f7,#4fb2ef);color:#04223a;border-radius:28px;padding:20px}
.sky .sk-l{font-size:15px;font-weight:700}
.sky .sk-v{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:8px;font-family:var(--round)}
.sky .sk-v small{font-size:24px}
.inner2{background:rgba(4,34,58,.12);border-radius:18px;padding:13px 14px;margin-top:16px;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
.inner2 svg{width:18px;height:18px;flex:none;margin-top:1px}
.inner2 b{display:block}
.sbars{display:flex;align-items:flex-end;gap:5px;height:66px;margin-top:16px}
.sbars i{flex:1;background:rgba(4,34,58,.78);border-radius:5px 5px 2px 2px;min-height:4px}
.sbars i.dim{background:rgba(4,34,58,.18)}
.sblab{display:flex;gap:5px;margin-top:6px}.sblab span{flex:1;text-align:center;font-size:12px;font-weight:700}
.app-card2 .sk-h{display:flex;justify-content:space-between;align-items:center}
.app-card2 img{width:46px;height:46px;border-radius:12px}
.app-card2 .sk-v{font-size:30px;letter-spacing:-.02em;margin-top:6px}
.sk-btn{margin-top:12px;width:100%;height:46px;border-radius:23px;background:#04223a;color:#fff;font-size:16px;font-weight:700}

/* bests row */
.bests{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.bests::-webkit-scrollbar{display:none}
.bq{width:104px;flex:none}
.bq .o{height:104px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff}
.bq .o .num{font-size:30px;font-weight:800;letter-spacing:-.03em}
.bq .o small{font-size:13px;font-weight:700}
.bq > b{display:block;font-size:13.5px;margin-top:8px;font-weight:600}
.bq > span{display:block;font-size:12px;color:var(--ink2)}

/* round icons in Settings rows */
.ic.round{width:34px;height:34px;border-radius:50%;color:#fff}.ic.round::before{opacity:1}.ic.round svg{width:18px;height:18px}
.set{border-radius:24px}
.set .r + .r::before{left:60px}

/* quick log sheet */
.qhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.sheet .qhead h3{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.qhead .circ{width:40px;height:40px}
.kdisp{text-align:center;margin-top:18px;font-weight:800}
.kdisp .num{font-size:80px;letter-spacing:-.05em;line-height:1}
.kdisp small{font-size:32px;color:var(--ink2);margin-left:6px;font-family:var(--round)}
.unit{margin:14px auto 0;width:max-content;max-width:100%;height:34px;border-radius:17px;background:var(--chip);display:flex;align-items:center;gap:7px;padding:0 13px 0 8px;font-size:14px;font-weight:600}
.sugg{display:flex;gap:8px;justify-content:center;margin-top:16px}
.sugg button{height:36px;padding:0 14px;border-radius:18px;background:var(--chip);font-size:15px;font-weight:700}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.keys button{height:52px;border-radius:26px;background:var(--chip);font-size:24px;font-weight:700;display:grid;place-items:center}
.keys button svg{width:22px;height:22px}
.keys button:active,.sugg button:active,.act2 button:active{transform:scale(.95)}
.act2{display:flex;gap:10px;margin-top:16px}
.act2 button{flex:1;height:54px;border-radius:27px;background:var(--ink);color:var(--page);font-size:17px;font-weight:700}
.act2 button.g{background:var(--chip);color:var(--ink)}.act2 button:disabled{opacity:.4}
.stepper.big{justify-content:center;gap:24px;margin-top:22px}
.stepper.big button{width:72px;height:72px}.stepper.big button svg{width:26px;height:26px}

/* tab bar + round quick-log button */
.tabbar{gap:10px;align-items:center}
.tabbar .in{max-width:310px}
.fab{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none;pointer-events:auto;color:var(--ink);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.fab svg{width:26px;height:26px}.fab:active{transform:scale(.92)}

/* 1.3.2: firm voice, open line, prayer picker, inline errors, actionable toast */
h1.tt em.miss,h2.sec em.miss,.openline.miss b,.openline.miss{color:var(--bad-ink)}
.openline{font-size:15px;color:var(--ink2);margin:0 2px 4px;line-height:1.35}.openline b{color:var(--ink);font-weight:600}
.sc .tag.miss{background:rgba(0,0,0,.32)}
.gkeys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:auto;font-size:13px;font-weight:600}
.gkeys span{display:inline-flex;align-items:center;gap:6px;opacity:.85}.gkeys span.hit{opacity:1}
.gkeys i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 2px #fff}.gkeys .hit i{background:#fff}
.ci .s.miss,.pc span.miss{color:var(--bad-ink);font-weight:700}
.str.lost .nm small{color:var(--bad-ink);font-weight:600}.str.lost .v{color:var(--bad-ink)}
.markrest{margin:10px 0 0;width:100%;height:44px;border-radius:22px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad-ink);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.markrest svg{width:15px;height:15px}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.popt{display:flex;align-items:center;gap:14px;height:58px;padding:0 14px;border-radius:18px;background:var(--chip);font-size:17px;font-weight:600;text-align:left}
.popt.on{box-shadow:inset 0 0 0 2px var(--em)}
.popt .o{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.popt .o svg{width:17px;height:17px}
.popt .o.s-on{background:var(--on-fill);color:var(--on-text)}.popt .o.s-late{background:var(--warn);color:#2b2100}.popt .o.s-miss{background:var(--miss-fill);color:#fff}.popt .o.open{box-shadow:inset 0 0 0 2px var(--line);color:var(--ink2)}
.popt .cur{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:600}
.field.err{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
.field.err::after{content:attr(data-err);display:block;font-size:13px;font-weight:600;color:var(--bad-ink);margin-top:2px}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px}
.toast button{background:var(--em);color:#fff;font-weight:700;border-radius:16px;height:32px;padding:0 14px}
.crow{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.sheet:focus{outline:none}

/* tab bar: floating Liquid Glass capsule */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom) + 10px);z-index:20;pointer-events:none}
.tabbar .in{position:relative;display:flex;width:100%;max-width:380px;padding:5px;border-radius:34px;pointer-events:auto}
.tab-bubble{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 3);border-radius:29px;background:var(--bubble);transition:transform .45s cubic-bezier(.3,1.35,.5,1);will-change:transform}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink);gap:3px;height:54px;border-radius:29px;font-weight:600;transition:color .2s}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--em)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--sheet);border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:560px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.show{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--none);margin:0 auto 12px}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}

.types{display:flex;gap:3px;margin-bottom:16px;background:var(--chip);border-radius:14px;padding:3px}
.types button{flex:1;text-align:center;font-size:14px;font-weight:600;padding:9px 0;border-radius:11px;color:var(--ink2)}
.types button.on{background:var(--accent-fill);color:#fff}
.types.run button.on{background:var(--run-fill)}
.types.gym button.on{background:var(--gym-fill)}
.types.football button.on{background:var(--foot-fill)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:10px;display:block;background:var(--card)}
.field span{display:block;font-size:12.5px;color:var(--ink2);font-weight:500}
.field input,.field select,.field textarea{width:100%;border:0;outline:0;background:transparent;font-size:20px;font-weight:700;padding:2px 0;font-family:var(--round)}
.field textarea{font-size:16px;font-weight:400;resize:none;font-family:inherit}
.field select{-webkit-appearance:none;appearance:none}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.calc{font-size:14px;color:var(--ink2);margin:0 2px 12px}
.save{width:100%;color:#fff;background:var(--accent-fill);text-align:center;font-weight:700;font-size:17px;height:52px;border-radius:26px;margin-top:6px}
.save.run{background:var(--run-fill)}.save.gym{background:var(--gym-fill)}.save.football{background:var(--foot-fill)}
.danger{width:100%;color:var(--bad-ink);font-weight:600;padding:14px;margin-top:6px}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px;font-size:16px;gap:10px}
.hint{font-size:13px;color:var(--ink2);margin:-4px 2px 12px;line-height:1.4}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,8px);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:22px;font-size:14px;font-weight:600;z-index:70;opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:0s!important}}
</style>

<body>
<main id="app"></main>

<div class="topbar" id="topbar" aria-hidden="true"></div>
<nav class="tabbar"><div class="in glass"><span class="tab-bubble" id="bubble" aria-hidden="true"></span>
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg>Today</button>
  <button class="tab" data-tab="summary"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="11" width="4.5" height="10" rx="1.3"/><rect x="9.75" y="4" width="4.5" height="17" rx="1.3"/><rect x="16" y="8" width="4.5" height="13" rx="1.3"/></svg>Summary</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.3" fill="none" stroke="currentColor" stroke-width="3.4" stroke-dasharray="3.26 3.26"/><path fill="currentColor" fill-rule="evenodd" d="M12 4.8a7.2 7.2 0 1 0 0 14.4a7.2 7.2 0 1 0 0-14.4zm0 4.3a2.9 2.9 0 1 1 0 5.8a2.9 2.9 0 1 1 0-5.8z"/></svg>Settings</button>
</div><button class="fab glass" data-act="quick" aria-label="Quick log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>'use strict';
/* Life Log — personal daily tracker. All data is stored on this device (localStorage). */
const VERSION = '1.3.2';
const KEY = 'lifelog.v1';
const PRAYERS = [['fajr','Fajr'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']];
const ACT = {
  run:      {name:'Run',      plural:'Runs',     color:'var(--run)',  emoji:'🏃'},
  gym:      {name:'Gym',      plural:'Gym',      color:'var(--gym)',  emoji:'🏋️'},
  football: {name:'Football', plural:'Football', color:'var(--foot)', emoji:'⚽'}
};
const SPLITS = ['Upper','Lower','Full','Other'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW1 = ['M','T','W','T','F','S','S'];
const WD_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* ---------------- dates ---------------- */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const weekStart = k => { const d = parseKey(k); d.setDate(d.getDate() - (d.getDay()+6)%7); return keyOf(d); };
const range = (a,b) => { const out=[]; for (let k=a; k<=b; k=addDays(k,1)) out.push(k); return out; };
const maxK = (a,b) => a>b?a:b, minK = (a,b) => a<b?a:b;
const fmtDay = (k,o) => parseKey(k).toLocaleDateString('en-GB', o || {weekday:'long', day:'numeric', month:'long'});
const shortDate = k => { const d = parseKey(k); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };

/* ---------------- formatting ---------------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (n,dp=1) => (Math.round(n*10**dp)/10**dp).toLocaleString('en-GB',{maximumFractionDigits:dp});
const L = ml => num(ml/1000, 2);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const dur = sec => { sec = Math.round(sec||0); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const pace = (sec,km) => km>0 && sec>0 ? dur(sec/km) + ' /km' : '–';
const plural = (n,w,p) => `${n} ${n===1?w:(p||w+'s')}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------------- state ---------------- */
function defaults(){
  return {
    v:1, start: todayKey(),
    settings:{
      waterGoal:2500, quick:[250,500,750],
      prayerGoal:5, lateCounts:false,
      runGoal:3, kmGoal:25, gymGoal:3, footGoal:1,
      lastBackup:null, installDismissed:false,
      trackers:[
        {id:'quran',    name:'Quran',          emoji:'📖', type:'count', unit:'pages', step:1, goal:2, period:'day',  builtin:true, show:true},
        {id:'creatine', name:'Creatine',       emoji:'💊', type:'check', goal:7, period:'week', builtin:true, show:true},
        {id:'skincare', name:'Night skincare', emoji:'🧴', type:'check', goal:7, period:'week', builtin:true, show:true}
      ]
    },
    days:{}, acts:[]
  };
}
function normalise(raw){
  const d = defaults();
  if (!raw || typeof raw !== 'object') return d;
  const s = Object.assign({}, d.settings, raw.settings || {});
  if (!Array.isArray(s.trackers)) s.trackers = d.settings.trackers;
  if (!Array.isArray(s.quick) || s.quick.length !== 3) s.quick = d.settings.quick;
  const out = { v:1, start: raw.start || d.start, settings:s, days: raw.days || {}, acts: Array.isArray(raw.acts) ? raw.acts : [] };
  // make sure start covers the earliest data we hold (e.g. after a restore)
  const keys = Object.keys(out.days).concat(out.acts.map(a => a.d)).filter(Boolean).sort();
  if (keys.length && keys[0] < out.start) out.start = keys[0];
  return out;
}
let S;
try { S = normalise(JSON.parse(localStorage.getItem(KEY))); } catch(e){ S = defaults(); }
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Couldn’t save — storage full or blocked'); }
}

const EMPTY = Object.freeze({w:[], p:{}, v:{}});
const day = k => S.days[k] || EMPTY;
const dayW = k => { let d = S.days[k]; if (!d){ d = S.days[k] = {w:[], p:{}, v:{}}; } d.w ||= []; d.p ||= {}; d.v ||= {}; return d; };
const trackers = () => S.settings.trackers;
const shownTrackers = () => trackers().filter(t => t.show !== false);
const tById = id => trackers().find(t => t.id === id);

/* ---------------- metrics ---------------- */
const waterTotal = k => (day(k).w || []).reduce((s,e) => s + e[1], 0);
const waterHit = k => S.settings.waterGoal > 0 && waterTotal(k) >= S.settings.waterGoal;
function prayerCounts(k){
  const p = day(k).p || {}, c = {on:0, late:0, missed:0, none:0};
  PRAYERS.forEach(([id]) => { const s = p[id]; if (s==='on') c.on++; else if (s==='late') c.late++; else if (s==='missed') c.missed++; else c.none++; });
  return c;
}
const prayerHit = k => { const c = prayerCounts(k); return c.on + (S.settings.lateCounts ? c.late : 0) >= S.settings.prayerGoal; };
const tVal = (k,id) => +((day(k).v || {})[id] || 0);
const isDaily = t => t.type === 'check' ? t.goal >= 7 : t.period === 'day';
const tDayHit = (t,k) => t.type === 'check' ? tVal(k,t.id) > 0 : (t.period === 'day' ? tVal(k,t.id) >= t.goal : tVal(k,t.id) > 0);
const actsOn = k => S.acts.filter(a => a.d === k);
const actsIn = (a,b,type) => S.acts.filter(x => x.d >= a && x.d <= b && (!type || x.type === type));
const sumKm = list => list.reduce((s,a) => s + (+a.km || 0), 0);
const sumMin = list => list.reduce((s,a) => s + (+a.min || 0), 0);

function weekProgress(ws){
  const we = addDays(ws,6), runs = actsIn(ws,we,'run');
  return { runs:runs.length, km:sumKm(runs), gym:actsIn(ws,we,'gym').length, foot:actsIn(ws,we,'football').length };
}
const runWeekHit  = ws => { const p = weekProgress(ws), g = S.settings; return p.runs >= g.runGoal && p.km >= (g.kmGoal||0) && (g.runGoal>0 || g.kmGoal>0); };
const gymWeekHit  = ws => S.settings.gymGoal  > 0 && weekProgress(ws).gym  >= S.settings.gymGoal;
const footWeekHit = ws => S.settings.footGoal > 0 && weekProgress(ws).foot >= S.settings.footGoal;
function tWeekValue(t,ws){
  const days = range(ws, addDays(ws,6));
  return t.type === 'check' ? days.filter(k => tVal(k,t.id) > 0).length : days.reduce((s,k) => s + tVal(k,t.id), 0);
}
const tWeekHit = (t,ws) => tWeekValue(t,ws) >= t.goal;

function dailyGoals(k){
  const g = [];
  if (S.settings.waterGoal > 0) g.push({name:'water', hit:waterHit(k), c:'var(--water)', p:waterTotal(k)/S.settings.waterGoal});
  const pc = prayerCounts(k);
  g.push({name:'prayers', hit:prayerHit(k), c:'var(--prayer)', p:(pc.on + (S.settings.lateCounts ? pc.late : 0))/(S.settings.prayerGoal||5)});
  shownTrackers().filter(isDaily).forEach(t => g.push({name:t.name, hit:tDayHit(t,k), c:tCol(t), p: t.type==='check' ? (tVal(k,t.id)?1:0) : tVal(k,t.id)/(t.goal||1)}));
  return g;
}
function streakDays(fn){
  let k = todayKey(); if (!fn(k)) k = addDays(k,-1);
  let n = 0; while (k >= S.start && fn(k)){ n++; k = addDays(k,-1); }
  return n;
}
function streakWeeks(fn){
  let ws = weekStart(todayKey()); if (!fn(ws)) ws = addDays(ws,-7);
  let n = 0; while (addDays(ws,6) >= S.start && fn(ws)){ n++; ws = addDays(ws,-7); }
  return n;
}

/* ---------------- UI state ---------------- */
const UI = { tab:'today', date: todayKey(), per:'week', anchor: todayKey(), lastToday: todayKey(), card: 0, set: 'goals' };
const $app = document.getElementById('app');
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function render(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === UI.tab));
  hideTip();
  const view = UI.tab + '|' + UI.date + '|' + UI.per + '|' + UI.anchor, prev = {};
  if (view === lastView) $app.querySelectorAll('[data-k]').forEach(el => prev[el.dataset.k] = [el.getAttribute('class'), el.getAttribute('style')]);
  lastView = view;
  const keep = {}; $app.querySelectorAll('[data-keep]').forEach(e => keep[e.dataset.keep] = e.scrollLeft);
  if (UI.tab === 'today') $app.innerHTML = renderToday();
  else if (UI.tab === 'summary') $app.innerHTML = renderSummary();
  else $app.innerHTML = renderSettings();
  placeBubble(); syncTopbar();
  $app.querySelectorAll('[data-keep]').forEach(e => { if (keep[e.dataset.keep]) e.scrollLeft = keep[e.dataset.keep]; });
  if (UI.tab === 'today') setupStack();
  const moved = [];
  $app.querySelectorAll('[data-k]').forEach(el => {
    const p = prev[el.dataset.k]; if (!p) return;
    const now = [el.getAttribute('class'), el.getAttribute('style')]; if (p[0] === now[0] && p[1] === now[1]) return;
    el.setAttribute('class', p[0] || ''); el.setAttribute('style', (p[1] || '') + ';transition:none'); moved.push([el, now]);
  });
  if (moved.length){ void $app.offsetWidth; moved.forEach(([el, now]) => { el.setAttribute('class', now[0] || ''); if (now[1] == null) el.removeAttribute('style'); else el.setAttribute('style', now[1]); }); }
}
let lastView = '';
function placeBubble(){
  // position by index, not by measuring, so the bubble always sits exactly under its tab
  const tabs = [...document.querySelectorAll('.tab')], i = tabs.findIndex(t => t.classList.contains('on')), b = document.getElementById('bubble');
  if (i < 0 || !b) return;
  b.style.transform = `translateX(${i * 100}%)`;
}
const $topbar = document.getElementById('topbar');
function syncTopbar(){
  const h1 = $app.querySelector('h1'); $topbar.textContent = h1 ? h1.textContent : '';
  $topbar.classList.toggle('show', scrollY > 56);
}

function backupDue(){
  const hasData = Object.keys(S.days).length || S.acts.length;
  if (!hasData) return null;
  const last = S.settings.lastBackup ? S.settings.lastBackup.slice(0,10) : S.start;
  const days = Math.round((parseKey(todayKey()) - parseKey(last)) / 864e5);
  return days >= 7 ? {days, never: !S.settings.lastBackup} : null;
}
function backupBanner(){
  const due = backupDue(); if (!due) return '';
  const msg = due.never ? `You haven’t backed up yet` : `Last backup ${due.days} days ago`;
  return `<div class="banner"><span class="bl">${ic('warn','var(--quran)')}<span>${msg}</span></span><button data-act="backup">Back up now</button></div>`;
}

/* ---------------- icons (drawn SVG, one stroke weight) ---------------- */
const sv = (d, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const sf = d => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${d}</svg>`;
const I = {
  drop: sf('<path d="M12 2.6c.3 0 .6.15.8.4 2.7 3.3 6.4 7.5 6.4 11.4a7.2 7.2 0 0 1-14.4 0c0-3.9 3.7-8.1 6.4-11.4.2-.25.5-.4.8-.4z"/>'),
  moon: sf('<path d="M20.6 14.3A8.7 8.7 0 0 1 9.7 3.4a.6.6 0 0 0-.8-.7A9.6 9.6 0 1 0 21.3 15.1a.6.6 0 0 0-.7-.8z"/>'),
  book: sv('<path d="M2.5 4.5h6a3.5 3.5 0 0 1 3.5 3.5v12.5a2.7 2.7 0 0 0-2.7-2.7H2.5z"/><path d="M21.5 4.5h-6A3.5 3.5 0 0 0 12 8v12.5a2.7 2.7 0 0 1 2.7-2.7h6.8z"/>'),
  pill: sv('<rect x="2.6" y="8.4" width="18.8" height="7.2" rx="3.6" transform="rotate(-45 12 12)"/><path d="M9.5 9.5l5 5"/>'),
  sparkle: sf('<path d="M11 2.5l1.9 5.6 5.6 1.9-5.6 1.9L11 17.5l-1.9-5.6L3.5 10l5.6-1.9z"/><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>'),
  cal: sv('<rect x="3" y="4.5" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>'),
  flame: sf('<path d="M12 22c4.1 0 7-2.9 7-6.9 0-3.5-2.3-5.9-4.2-8-.4 1.9-1.3 3.2-2.5 3.8.3-3.3-1.2-6.2-3.7-8.4.2 3.5-1.9 5.6-3.3 7.8C4.4 11.9 5 13.6 5 15.1 5 19.1 7.9 22 12 22z"/>'),
  run: sv('<circle cx="15" cy="4.2" r="1.9" fill="currentColor" stroke="none"/><path d="M6 21l3.4-5.2 3.4 2.6V22M9.4 15.8l1.9-6.1M11.3 9.7 7.6 11.2l-1.5 3M11.3 9.7l3.4-.6 1.9 3.6 3.2.9"/>', 2.1),
  gym: sv('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>', 2.4),
  ball: sv('<circle cx="12" cy="12" r="9"/><path d="M12 8l3.3 2.4-1.3 3.9h-4l-1.3-3.9zM12 8V3.3M15.3 10.4l4.4-1.4M14 14.3l2.7 3.8M10 14.3l-2.7 3.8M8.7 10.4 4.3 9"/>', 1.7),
  list: sv('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor" stroke="none"/>'),
  star: sf('<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/>'),
  check: sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 3),
  plus: sv('<path d="M12 5v14M5 12h14"/>', 2.6),

  x: sv('<path d="M6 6l12 12M18 6 6 18"/>', 3),
  back: sv('<path d="M9 5h10.5A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/>', 2.1),
  chevL: sv('<path d="M15 5l-7 7 7 7"/>', 2.6),
  chevR: sv('<path d="M9 5l7 7-7 7"/>', 2.6),
  arrUp: sv('<path d="M12 19V5M6 11l6-6 6 6"/>', 2.6),
  arrDown: sv('<path d="M12 5v14M6 13l6 6 6-6"/>', 2.6),

const OKM = `<span class="ok" aria-label="goal hit">${I.check}</span>`;
const ic = (icon, c, cls) => `<span class="ic ${cls||''}" style="--c:${c}">${I[icon] || `<span class="em">${esc(icon||'•')}</span>`}</span>`;
const T_ICON = {quran:'book', creatine:'pill', skincare:'sparkle'};
const T_COL  = {quran:'var(--quran)', creatine:'var(--creatine)', skincare:'var(--skincare)'};
const tIc  = t => T_ICON[t.id] || t.emoji || 'star';
const tCol = t => T_COL[t.id] || 'var(--habit)';
const A_ICON = {run:'run', gym:'gym', football:'ball'};

/* ---------------- TODAY ---------------- */
function goalRing(goals, mono){
  const n = goals.length || 1, r = 40, C = 2*Math.PI*r, sw = 11, seg = C/n, gap = n > 1 ? 4 + sw : 0, len = Math.max(seg - gap, 0.01);
  let s = '';
  goals.forEach((g,i) => {
    const off = -(i*seg + gap/2), col = mono ? '#fff' : g.c;
    s += `<circle cx="50" cy="50" r="${r}" fill="none" stroke="${col}" stroke-opacity="${mono ? .28 : .2}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${off}"/>`;
    const f = g.hit ? 1 : Math.max(0, Math.min(1, g.p || 0)), fl = f > 0 ? Math.max(0.01, len*f) : 0;
    s += `<circle data-k="ring${i}" cx="50" cy="50" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dashoffset="${off}" opacity="${f>0?1:0}" style="stroke-dasharray:${fl} ${C};transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1),opacity .2s"/>`;
  });
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-90 50 50)">${s}</g></svg>`;
}
const PSTATE = {on:['On time','s-on',I.check], late:['Late','s-late',I.check], missed:['Missed','s-miss',I.x]};
function dateNav(label, prevAct, nextAct, nextOff, extra){
  return `<div class="topnav"><div class="datepill"><button class="dp" data-act="${prevAct}" aria-label="Previous">${I.chevL}</button><span>${label}</span><button class="dp" data-act="${nextAct}" aria-label="Next" ${nextOff?'disabled':''}>${I.chevR}</button></div>${extra||''}</div>`;
}
const sec = (a, b, extra, miss) => `<h2 class="sec"><span>${a}${b ? `, <em class="${miss?'miss':''}">${b}</em>` : ''}</span>${extra||''}</h2>`;
// a daily streak that broke in the last 3 days after running for 3+ days
function lostDays(fn){
  const tk = todayKey();
  for (let back = 1; back <= 3; back++){
    const miss = addDays(tk, -back);
    if (miss < S.start || fn(miss)) continue;
    let len = 0, k = addDays(miss, -1);
    while (k >= S.start && fn(k)){ len++; k = addDays(k, -1); }
    if (len >= 3) return {len, miss, ago: back};
  }
  return null;
}

function renderToday(){
  const k = UI.date, tk = todayKey(), g = S.settings, past = k < tk;
  const dayName = k === tk ? 'Today' : k === addDays(tk,-1) ? 'Yesterday' : fmtDay(k,{weekday:'long'});
  const goals = dailyGoals(k), done = goals.filter(x => x.hit).length, n = goals.length;
  const left = goals.filter(x => !x.hit).map(x => capFirst(x.name));

  // best live daily streak for the flame badge
  const dStreaks = [g.waterGoal > 0 ? streakDays(waterHit) : 0, streakDays(prayerHit), ...shownTrackers().filter(isDaily).map(t => streakDays(k2 => tDayHit(t,k2)))];
  const bestNow = Math.max(0, ...dStreaks);
  const right = k !== tk ? `<button class="todaybtn" data-act="goToday">Today</button>`
    : `<button class="circ flame" data-act="toStreaks" aria-label="Best current streak: ${bestNow} days">${I.flame}${bestNow ? `<span class="badge num">${bestNow}</span>` : ''}</button>`;
  let h = dateNav(fmtDay(k,{weekday:'long',day:'numeric',month:'short', year: k.slice(0,4)!==tk.slice(0,4)?'numeric':undefined}), 'prevDay', 'nextDay', k >= tk, right);
  const all = n && done === n;
  h += `<h1 class="tt">${dayName}, <em class="${past && !all ? 'miss' : ''}">${all ? 'all done' : past ? `${n - done} of ${n} missed` : `${done} of ${n} done`}</em></h1>`;
  h += `<p class="openline ${past && left.length ? 'miss' : ''}">${left.length ? `${past ? 'Missed' : 'Still open'}: <b>${esc(listJoin(left))}</b>` : (past ? 'Every daily goal was hit this day.' : 'Every daily goal hit today.')}</p>`;

  if (isIOS && !isStandalone() && !g.installDismissed){
    h += `<div class="banner"><span class="bl">${ic('share','var(--accent)')}<span><b>Install first:</b> tap <b>Share</b> → <b>Add to Home Screen</b>, then use the app from there. Data logged here in Safari isn’t shared with the home-screen app.</span></span><button data-act="dismissInstall">OK</button></div>`;
  }
  h += backupBanner();

  // ---- card stack: water, daily goals, this week (swipe or tap the dots)
  const wt = waterTotal(k), wh = waterHit(k), wp = Math.min(100, pct(wt, g.waterGoal)), drinks = day(k).w.length;
  const short = Math.max(0, g.waterGoal - wt);
  const wState = wh ? 'Goal hit' : past ? `${fmtDay(k,{weekday:'short'})}: missed by ${L(short)} L` : `${L(short)} L to go`;
  const ci0 = UI.card || 0, inert = i => ((i - ci0 + 3) % 3) ? 'inert' : '';
  const cWater = i => `<div class="sc-in" ${inert(i)}><h2 class="sch">Water</h2><span class="tag ${past && !wh ? 'miss' : ''}">${wState} · goal ${L(g.waterGoal)} L</span>
    <div class="big num">${L(wt)}<small>L</small></div><div class="track"><i data-k="wbar" style="width:${wp}%"></i></div>
    <div class="qrow">${g.quick.map(ml => `<button class="qb num" data-act="water" data-ml="${ml}">+${ml}</button>`).join('')}</div>
    <div class="qrow sm"><button class="qs" data-act="quick">${I.plus}Other amount</button><button class="qs" data-act="undoWater" ${drinks?'':'disabled'}>${I.undo}Undo</button></div></div>`;
  const cGoals = i => `<div class="sc-in" ${inert(i)}><h2 class="sch">Daily goals</h2>
    <div class="ring big-ring">${goalRing(goals, true)}<div class="c"><div><b class="num">${done}/${n}</b><small>done</small></div></div></div>
    <div class="gkeys">${goals.map(x => `<span class="${x.hit?'hit':''}"><i></i>${esc(capFirst(x.name))}</span>`).join('')}</div></div>`;
  const ws = weekStart(k), wpg = weekProgress(ws);
  const wrow2 = (label, val, goal, extra) => `<div class="wr"><div class="wl"><span>${label}</span><b class="num">${num(val,2)} / ${num(goal,2)}</b></div><div class="track thin"><i data-k="wk-${esc(label)}" style="width:${Math.min(100,pct(val,goal||1))}%"></i></div>${extra?`<div class="wx">${extra}</div>`:''}</div>`;
  let wk = wrow2('Runs', wpg.runs, g.runGoal, `${num(wpg.km)} of ${num(g.kmGoal)} km`) + wrow2('Gym', wpg.gym, g.gymGoal);
  shownTrackers().filter(t => !isDaily(t)).forEach(t => wk += wrow2(esc(t.name), tWeekValue(t,ws), t.goal));
  const cWeek = i => `<div class="sc-in" ${inert(i)}><h2 class="sch">This week</h2><span class="tag">${shortDate(ws)} – ${shortDate(addDays(ws,6))}</span><div class="wk2">${wk}</div>
    <div class="qrow"><button class="qb" data-act="addAct" data-type="run">${I.plus}Run</button><button class="qb" data-act="addAct" data-type="gym">${I.plus}Gym</button></div></div>`;
  const cards = [['water', cWater], ['goals', cGoals], ['week', cWeek]];
  h += `<div class="stack" id="stack">${cards.map(([id, fnc], i) => `<div class="sc sc-${id} pos${(i - ci0 + 3) % 3}" data-k="sc-${id}" data-ci="${i}">${fnc(i)}</div>`).join('')}</div>
    <div class="dots" role="group" aria-label="Cards">${cards.map(([id], i) => `<button class="${i===ci0?'on':''}" data-act="card" data-i="${i}" aria-label="Show ${id} card" aria-current="${i===ci0}"></button>`).join('')}</div>`;

  // ---- prayers: tap an open prayer = on time; tap a logged one to change it
  const pc = prayerCounts(k), p = day(k).p || {}, open = PRAYERS.filter(([id]) => !p[id]).length;
  h += sec('Prayers', `${pc.on} of 5 on time`, prayerHit(k) ? OKM : '', past && pc.on < 5) + `<div class="card prow">${PRAYERS.map(([id,name]) => {
    const st = PSTATE[p[id]];
    const lbl = st ? st[0] : (past ? 'Not logged' : 'Tap');
    return `<button class="pc" data-act="pcycle" data-p="${id}" aria-label="${name}: ${st ? st[0] : 'not logged'}. ${st ? 'Tap to change.' : 'Tap to mark on time.'}"><span class="o ${st ? st[1] : 'open'}" data-k="pc-${id}">${st ? st[2] : I.plus}</span><b>${name}</b><span class="${!st && past ? 'miss' : ''}">${lbl}</span></button>`;
  }).join('')}</div>`;
  h += past && open ? `<button class="markrest" data-act="markRest">${I.x}Mark the other ${open === 1 ? 'prayer' : open + ' prayers'} missed</button>`
    : `<div class="hint2">Tap a prayer to mark it on time. Tap again to change it.</div>`;

  // ---- habits as circles: tap to log
  let cr = '', hits = 0, nh = 0;
  shownTrackers().forEach(t => {
    const v = tVal(k,t.id), hit = tDayHit(t,k) && (t.type === 'check' || t.period === 'day'), daily = isDaily(t);
    if (daily){ nh++; if (hit) hits++; }
    const miss = past && daily && !hit;
    const sub = t.type === 'check' ? (v ? 'Done' : (past ? 'Missed' : 'Not yet')) : `${num(v,2)}${miss ? ` of ${num(t.goal,2)}` : ''} ${esc(t.unit||'')}`;
    const act = t.type === 'check' ? `data-act="check" data-id="${t.id}" role="switch" aria-checked="${!!v}"` : `data-act="tStep" data-id="${t.id}"`;
    cr += `<button class="ci ${hit?'done':''}" style="--c:${tCol(t)}" ${act} aria-label="${esc(t.name)}: ${sub}"><span class="o">${I[tIc(t)] || `<span class="em">${esc(t.emoji||'•')}</span>`}${hit?`<span class="ck">${I.check}</span>`:''}</span><b>${esc(t.name)}</b><span class="s ${hit?'hit':miss?'miss':''}">${sub}</span></button>`;
  });
  const runOk = g.runGoal > 0 && wpg.runs >= g.runGoal, gymOk = g.gymGoal > 0 && wpg.gym >= g.gymGoal;
  cr += `<button class="ci ${runOk?'done':''}" style="--c:var(--run)" data-act="addAct" data-type="run" aria-label="Log a run. ${wpg.runs} of ${g.runGoal} this week"><span class="o">${I.run}${runOk?`<span class="ck">${I.check}</span>`:''}</span><b>Run</b><span class="s ${runOk?'hit':''}">${wpg.runs} of ${g.runGoal}</span></button>`;
  cr += `<button class="ci ${gymOk?'done':''}" style="--c:var(--gym)" data-act="addAct" data-type="gym" aria-label="Log gym. ${wpg.gym} of ${g.gymGoal} this week"><span class="o">${I.gym}${gymOk?`<span class="ck">${I.check}</span>`:''}</span><b>Gym</b><span class="s ${gymOk?'hit':''}">${wpg.gym} of ${g.gymGoal}</span></button>`;
  cr += `<button class="ci newt" data-act="tracker" data-id=""><span class="o">${I.plus}</span><b>Add</b><span class="s">Tracker</span></button>`;
  h += sec('Habits', nh ? `${hits} of ${nh} done` : 'tap to log', '', past && hits < nh) + `<div class="crow" data-keep="habits">${cr}</div>`;

  // ---- logged list
  const items = [];
  (day(k).w || []).forEach(([t,ml]) => items.push({t, html:`${ic('drop','var(--water)')}<div class="main"><span class="num">${ml} ml</span> water<div class="meta">${keyOf(new Date(t))===k?timeOf(t):'Added later'}</div></div><button class="x" data-act="delWater" data-t="${t}" aria-label="Delete ${ml} ml water">${I.x}</button>`}));
  actsOn(k).forEach(a => items.push({t:a.t||0, html:`${ic(A_ICON[a.type], ACT[a.type].color)}<button class="main" data-act="editAct" data-id="${a.id}">${actText(a)}<div class="meta">${a.note?esc(a.note)+' · ':''}Tap to edit</div></button><button class="x" data-act="delAct" data-id="${a.id}" aria-label="Delete activity">${I.x}</button>`}));
  items.sort((a,b) => b.t - a.t);
  h += sec('Logged', items.length ? plural(items.length, 'entry', 'entries') : 'nothing yet') + `<div class="card">${items.length ? items.map(i => `<div class="li">${i.html}</div>`).join('') : `<div class="empty">Water and activities you add show here.</div>`}</div>`;

  // ---- streaks: live ones, plus any broken in the last 3 days
  const st = [], lost = [], sd = f => [streakDays(f), bestDays(f), 'day'], sw = f => [streakWeeks(f), bestWeeks(f), 'week'];
  const addD = (icon, c, name, f) => { st.push([icon, c, name, ...sd(f)]); const l = lostDays(f); if (l && streakDays(f) < l.len) lost.push([icon, c, name, l]); };
  if (g.waterGoal>0) addD('drop','var(--water)','Water goal', waterHit);
  addD('moon','var(--prayer)','Prayer goal', prayerHit);
  shownTrackers().forEach(t => isDaily(t) ? addD(tIc(t), tCol(t), t.name, k2 => tDayHit(t,k2)) : st.push([tIc(t), tCol(t), `${t.name} weekly goal`, ...sw(ws2 => tWeekHit(t,ws2))]));
  st.push(['run','var(--run)','Runs weekly goal', ...sw(runWeekHit)], ['gym','var(--gym)','Gym weekly goal', ...sw(gymWeekHit)]);
  const live = st.filter(s => s[3] >= 2).sort((a,b) => b[3]-a[3]), un = (n2,w) => n2===1 ? w : w+'s';
  const agoTxt = a => a === 1 ? 'yesterday' : `${a} days ago`;
  const lostRows = lost.map(([icon, c, name, l]) => `<div class="str lost">${ic(icon, c, 'lg')}<span class="nm">${esc(name)}<small>Lost at ${l.len} days, ${agoTxt(l.ago)}</small></span><span class="v">0<small>days</small></span></div>`).join('');
  const liveRows = live.map(s => `<div class="str">${ic(s[0], s[1], 'lg')}<span class="nm">${esc(s[2])}<small>${s[3] >= s[4] ? '<span class="rec">Record</span>' : `Best ${s[4]} ${un(s[4],s[5])}`}</small></span><span class="v">${s[3]}<small>${un(s[3],s[5])}</small></span></div>`).join('');
  h += `<div id="streaks"></div>` + sec('Streaks', `${live.length} live${lost.length ? `, ${lost.length} lost` : ''}`, '', lost.length > 0) + `<div class="card">${lostRows + liveRows || `<div class="empty">Hit a goal two days (or weeks) in a row and your streaks appear here.</div>`}</div>`;
  return h;
}

/* ---- quick log (the round + button), the prayer picker and the tracker stepper ---- */
const typeChips = (on, editing) => `<div class="chips" role="group" aria-label="What to log">${editing ? '' : `<button class="${on==='water'?'on':''}" data-act="quick">Water</button>`}${['run','gym','football'].map(t => `<button class="${on===t?'on':''}" data-act="${on==='water'?'addAct':'actType'}" data-type="${t}">${ACT[t].name}</button>`).join('')}</div>`;
function quickSheet(){
  const k = UI.date, g = S.settings, kv = '';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
  const h = head('Log') + typeChips('water') + `
    <div class="kdisp"><span class="num" id="kv">0</span><small>ml</small></div>
    <div class="unit">${ic('drop','var(--water)','xs')}<span id="ktoday">Water · ${k === todayKey() ? 'today' : fmtDay(k,{weekday:'short',day:'numeric',month:'short'})} ${L(waterTotal(k))} L</span></div>
    <div class="sugg">${g.quick.map(ml => `<button class="num" data-act="kPreset" data-ml="${ml}">${ml}</button>`).join('')}</div>
    <div class="keys">${keys.map(x => x === '' ? '<span></span>' : `<button class="num" data-act="key" data-k="${x}" ${x==='del'?'aria-label="Delete digit"':''}>${x === 'del' ? I.back : x}</button>`).join('')}</div>
    <div class="act2"><button class="g" data-act="kUndo" ${day(k).w.length?'':'disabled'}>Undo last</button><button data-act="kAdd" id="kadd" disabled>Add</button></div>`;

}
function syncQuick(){
  if (!sheetCtx || sheetCtx.kind !== 'quick') return;
  const kv = sheetCtx.kv || '', add = $sheet.querySelector('#kadd');
  $sheet.querySelector('#kv').textContent = kv || '0';
  add.textContent = kv ? `Add ${kv} ml` : 'Add'; add.disabled = !kv;
  $sheet.querySelector('#ktoday').textContent = `Water · ${UI.date === todayKey() ? 'today' : fmtDay(UI.date,{weekday:'short',day:'numeric',month:'short'})} ${L(waterTotal(UI.date))} L`;
  $sheet.querySelector('[data-act="kUndo"]').disabled = !day(UI.date).w.length;
}
function prayerSheet(id){
  const name = PRAYERS.find(x => x[0] === id)[1], cur = (day(UI.date).p || {})[id];
  const opt = (s, label, cls, icon) => `<button class="popt ${cur===s?'on':''}" data-act="pset" data-p="${id}" data-s="${s}"><span class="o ${cls}">${icon}</span>${label}${cur===s?`<span class="cur">Current</span>`:''}</button>`;
  openSheet(head(name) + `<div class="plist">${opt('on','On time','s-on',I.check)}${opt('late','Late','s-late',I.check)}${opt('missed','Missed','s-miss',I.x)}${opt('','Clear','open',I.minus)}</div>`, {kind:'prayer', id});
}
function stepSheet(id){
  const t = tById(id), v = tVal(UI.date, id);
  openSheet(head(esc(t.name)) + `
    <div class="kdisp"><span class="num" id="tsv">${num(v,2)}</span><small>${esc(t.unit||'')}</small></div>
    <div class="unit">${ic(tIc(t), tCol(t), 'xs')}<span>Goal ${num(t.goal,2)} ${esc(t.unit||'')} a ${t.period}</span></div>
    <div class="stepper big"><button data-act="step" data-id="${t.id}" data-dir="-1" aria-label="Less">${I.minus}</button><button data-act="step" data-id="${t.id}" data-dir="1" aria-label="More">${I.plus}</button></div>
    <div class="act2"><button data-act="close">Done</button></div>`, {kind:'tstep', id});
}
function setupStack(){
  const st = document.getElementById('stack'); if (!st) return;
  let x0 = null, y0 = 0, dx = 0, front = null;
  st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; front = st.querySelector('.pos0'); }, {passive:true});
  st.addEventListener('touchmove', e => {
    if (x0 == null || !front) return;
    dx = e.touches[0].clientX - x0;
    if (Math.abs(dx) > Math.abs(e.touches[0].clientY - y0)) { front.style.transition = 'none'; front.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`; }
  }, {passive:true});
  st.addEventListener('touchend', () => {
    if (front){ front.style.transition = ''; front.style.transform = ''; }
    if (Math.abs(dx) > 50){ UI.card = ((UI.card||0) + (dx < 0 ? 1 : 2)) % 3; render(); }
    x0 = null; front = null;
  });
  // tapping a card peeking out behind brings it to the front
  st.querySelectorAll('.pos1,.pos2').forEach(c => c.addEventListener('click', () => { UI.card = +c.dataset.ci; render(); }));
}
const timeOf = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);
const listJoin = a => a.length < 2 ? a.join('') : a.slice(0,-1).join(', ') + ' & ' + a[a.length-1];
function actText(a){
  if (a.type === 'run') return `Run · ${num(a.km)} km${a.sec?` · ${dur(a.sec)} · ${pace(a.sec,a.km)}`:''}`;
  if (a.type === 'gym') return `Gym · ${esc(a.split||'Other')}${a.min?` · ${a.min} min`:''}`;
  return `Football${a.min?` · ${a.min} min`:''}`;
}

/* ---------------- SUMMARY ---------------- */
function periodRange(){
  const k = UI.anchor, d = parseKey(k);
  if (UI.per === 'week'){ const a = weekStart(k); return [a, addDays(a,6)]; }
  if (UI.per === 'month') return [keyOf(new Date(d.getFullYear(), d.getMonth(), 1)), keyOf(new Date(d.getFullYear(), d.getMonth()+1, 0))];
  return [`${d.getFullYear()}-01-01`, `${d.getFullYear()}-12-31`];
}
function periodLabel(a,b){
  if (UI.per === 'week') return `${shortDate(a)} – ${shortDate(b)} ${b.slice(0,4)}`;
  if (UI.per === 'month') return parseKey(a).toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  return a.slice(0,4);
}

// trend arrow: direction from rates; tapping shows the earlier figure
function trend(cur, prev, tip){

  const word = dir === 'up' ? 'Up' : dir === 'down' ? 'Down' : 'Level';
  return `<span class="trend ${dir} hit" role="img" aria-label="${word} on ${esc(tip)}" data-tip="${esc(word + ' on ' + tip)}">${dir === 'up' ? I.arrUp : dir === 'down' ? I.arrDown : I.minus}</span>`;
}
// longest run of consecutive hits since tracking began
function bestDays(fn){

function paceCard(a, b){
  const span0 = UI.per === 'year' ? maxK(a, S.start) : maxK(S.start, addDays(b, -55)), to = minK(b, todayKey());
  const runs = actsIn(span0, to, 'run').filter(paceSec).sort((p,q) => p.d < q.d ? -1 : p.d > q.d ? 1 : (p.t||0) - (q.t||0));
  const from = runs.length ? runs[0].d : span0;
  const sub = UI.per === 'year' ? a.slice(0,4) : 'Last 8 weeks';
  // all-time bests
  const all = S.acts.filter(x => x.type === 'run');
  const longest = all.reduce((m,x) => Math.max(m, +x.km || 0), 0);
  const fast = all.filter(x => +x.km >= 1 && paceSec(x)).reduce((m,x) => Math.min(m, paceSec(x)), Infinity);
  let bestWk = 0; for (let ws = weekStart(S.start); ws <= todayKey(); ws = addDays(ws,7)) bestWk = Math.max(bestWk, weekProgress(ws).km);
  const pbs = '';
  if (runs.length < 2) return longest ? card('Runs|your pace', sub, `<div class="empty">Log at least two runs with a time to see your pace trend.</div>` + pbs, false, 'run', 'var(--run)') : '';
  const W = 320, H = 150, t = 14, bt = 20, ih = H-t-bt, d0 = parseKey(from), dx = r => (parseKey(r.d) - d0) / 864e5, span = Math.max(1, (parseKey(to) - d0) / 864e5);
  const ps = runs.map(paceSec), spread = Math.max(...ps) - Math.min(...ps), padY = Math.max(6, spread * 0.1);
  const lo = Math.min(...ps) - padY, hi = Math.max(...ps) + padY, step = [10,15,30,60,120,300].find(v => (hi - lo) / v <= 3.2) || 600;
  const px = r => 10 + dx(r) / span * (W - 20), py = p => t + (p - lo) / (hi - lo) * ih; // faster = higher
  // least-squares trend
  const xs = runs.map(dx), mx = xs.reduce((a,v) => a+v, 0)/xs.length, my = ps.reduce((a,v) => a+v, 0)/ps.length;
  const sxx = xs.reduce((a,v) => a + (v-mx)**2, 0), slope = sxx ? xs.reduce((a,v,i) => a + (v-mx)*(ps[i]-my), 0) / sxx : 0;
  const fit = v => my + slope * (v - mx), x0 = Math.min(...xs), x1 = Math.max(...xs), change = Math.round(fit(x1) - fit(x0));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Run pace over time">`;
  for (let p = Math.ceil(lo / step) * step; p < hi; p += step) s += `<line x1="0" x2="${W}" y1="${py(p)}" y2="${py(p)}" stroke="var(--line)" stroke-width=".6"/><text class="ax" x="0" y="${py(p)-4}">${fmtPace(p)} /km</text>`;
  if (sxx) s += `<line x1="${px({d:addDays(from, Math.round(x0))})}" y1="${py(fit(x0))}" x2="${px({d:addDays(from, Math.round(x1))})}" y2="${py(fit(x1))}" stroke="var(--run)" stroke-width="2" opacity=".45" stroke-linecap="round"/>`;
  const last = runs[runs.length - 1];
  runs.forEach(r => s += `<circle class="hit" cx="${px(r)}" cy="${py(paceSec(r))}" r="${r === last ? 7 : 5}" fill="var(--run)" ${r === last ? 'stroke="var(--card)" stroke-width="2.5"' : ''} data-tip="${esc(`${fmtDay(r.d,{weekday:'short',day:'numeric',month:'short'})}: ${num(r.km)} km in ${dur(r.sec)} · ${pace(r.sec, r.km)}`)}"/>`);
  s += `<text class="ax" x="0" y="${H-4}">${shortDate(from)}</text><text class="ax" x="${W}" y="${H-4}" text-anchor="end">${shortDate(to)}</text></svg>`;
  const amt = Math.abs(change) >= 60 ? `${dur(Math.abs(change))} min/km` : `${Math.abs(change)} s/km`;
  const trend = Math.abs(change) < 3 ? 'Pace is holding steady.' : change < 0 ? `Trend: ${amt} quicker over this span.` : `Trend: ${amt} slower over this span.`;
  s += `<div class="note left">Higher = faster. Latest run (large dot): <b>${fmtPace(paceSec(last))} /km</b>. ${trend}</div>` + pbs;
  return card('Runs|your pace', sub, s, false, 'run', 'var(--run)');
}

  const avg = days.reduce((s,k) => s + ratio(k), 0) / days.length, pavg = pdays.length ? pdays.reduce((s,k) => s + ratio(k), 0) / pdays.length : null;
  const inSet = new Set(days); let bars = [], labs = [];

  shownTrackers().forEach(tr => {

      const dn = days.filter(k => tVal(k,tr.id)>0).length, pdn = pdays.filter(k => tVal(k,tr.id)>0).length;
